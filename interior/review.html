<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f1e9"><title>展品暖光与香槟金灯具 · 莞香入庭</title>
<style>
:root{color-scheme:light;--paper:#f5f1e9;--ink:#302c25;--muted:#625c51;--rule:#cec6b8;--accent:#513d2e;--serif:"Songti SC","SimSun","Noto Serif CJK SC",serif}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--paper);color:var(--ink)}a{color:inherit;text-underline-offset:.24em}a:focus-visible,button:focus-visible{outline:3px solid #986434;outline-offset:3px}header,main{width:min(1720px,100%);margin:auto;padding-inline:clamp(16px,3.8vw,70px)}header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-block:17px;border-bottom:1px solid var(--rule)}.brand{font:600 clamp(21px,2.3vw,28px)/1.2 var(--serif);letter-spacing:.12em}header a{font-size:14px}main{padding-bottom:50px}.heading{padding-block:clamp(24px,3vw,48px) 20px}.heading p,p{color:var(--muted);margin:7px 0 0;font-size:clamp(14px,1.1vw,17px)}h1,h2,h3{margin:0;line-height:1.25}h1{font:600 clamp(33px,3.5vw,58px)/1.2 var(--serif);letter-spacing:.04em}h2{font:600 clamp(23px,2.2vw,35px)/1.3 var(--serif)}h3{font-size:17px;font-weight:600}.room{padding:20px 0 32px;border-top:1px solid var(--rule)}.roomhead{display:flex;align-items:baseline;gap:17px;margin-bottom:14px}.roomhead p{margin:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.3vw,24px)}figure{margin:0;min-width:0}.art{display:block;background:#e6dfd3;border-radius:2px;overflow:hidden}.art img{display:block;width:100%;height:auto;aspect-ratio:8/5}.caption{display:flex;justify-content:space-between;align-items:start;gap:12px;padding-top:11px}.caption p{font-size:14px}.switch{display:inline-flex;border:1px solid #aaa08f;border-radius:3px;white-space:nowrap;overflow:hidden;flex-shrink:0}.switch button{font:inherit;font-size:13px;color:var(--accent);padding:6px 10px;min-height:34px;background:transparent;border:0;cursor:pointer}.switch button[aria-pressed="true"]{background:#453e33;color:white}.lamp-zoom{font-size:13px}.original{font-size:13px;white-space:nowrap;line-height:2}.art:focus-visible{outline-offset:2px}.sr{position:absolute;clip-path:inset(50%);height:1px;width:1px;overflow:hidden}
@media(max-width:780px){.pair{grid-template-columns:1fr;gap:25px}.roomhead{display:block}.roomhead p{margin-top:4px}.heading{padding-bottom:20px}.room{padding-block:18px 25px}.caption{padding-top:9px}.switch button{min-height:40px}}
@media(max-width:410px){.caption{flex-wrap:wrap;gap:6px}.switch button{padding-inline:9px}.roomhead{margin-bottom:9px}}
</style>
</head>
<body><header><span class="brand">莞香入庭</span><a href="./">现有三维环视</a></header>
<main><div class="heading"><h1>展品暖光与香槟金灯具</h1><p>每张均可与上版同机位比较，点开可查看 4096 × 2560 原图。两张全景下方另附灯具细节。</p></div>
<section class="room"><div class="roomhead"><h2>品香主厅</h2></div><div class="pair"><figure data-view="main-wide">
              <a class="art" href="proof/main-wide.jpg?v=r132" aria-label="查看主展墙与中央展台原图"><img src="proof/main-wide-preview.webp?v=r132" width="1280" height="800" alt="品香主厅，主展墙与中央展台" data-current="proof/main-wide-preview.webp?v=r132" data-large="proof/main-wide.jpg?v=r132" data-prior="proof/base-main-wide.jpg?v=r132" data-currentalt="品香主厅，主展墙与中央展台" data-prioralt="品香主厅，主展墙与中央展台（上版）"></a>
              <figcaption class="caption"><div><h3>主展墙与中央展台</h3><p data-note data-current="两盏压纹玻璃壁灯分列展墙两侧。" data-prior="上版的主展墙与中央展台。">两盏压纹玻璃壁灯分列展墙两侧。</p>
              <a class="original" href="proof/main-wide.jpg?v=r132">查看原图</a>　<a class="lamp-zoom" href="proof/wall-lamp.jpg?v=r132">放大壁灯</a></div>
              <div class="switch" role="group" aria-label="主展墙与中央展台同机位比较"><button type="button" data-which="current" aria-pressed="true">本次</button><button type="button" data-which="prior" aria-pressed="false">上版</button></div></figcaption>
              </figure><figure data-view="main-detail">
              <a class="art" href="proof/main-detail.jpg?v=r132" aria-label="查看山形熏炉原图"><img src="proof/main-detail-preview.webp?v=r132" width="1280" height="800" alt="品香主厅，山形熏炉" data-current="proof/main-detail-preview.webp?v=r132" data-large="proof/main-detail.jpg?v=r132" data-prior="proof/base-main-detail.jpg?v=r132" data-currentalt="品香主厅，山形熏炉" data-prioralt="品香主厅，山形熏炉（上版）"></a>
              <figcaption class="caption"><div><h3>山形熏炉</h3><p data-note data-current="暖光掠过山脊和透烟孔，铜面的亮暗随起伏变化。" data-prior="上版铜炉表面的色温与反射。">暖光掠过山脊和透烟孔，铜面的亮暗随起伏变化。</p>
              <a class="original" href="proof/main-detail.jpg?v=r132">查看原图</a></div>
              <div class="switch" role="group" aria-label="山形熏炉同机位比较"><button type="button" data-which="current" aria-pressed="true">本次</button><button type="button" data-which="prior" aria-pressed="false">上版</button></div></figcaption>
              </figure></div></section>
<section class="room"><div class="roomhead"><h2>传香工坊</h2></div><div class="pair"><figure data-view="workshop-wide">
              <a class="art" href="proof/workshop-wide.jpg?v=r132" aria-label="查看手作桌与方灯原图"><img src="proof/workshop-wide-preview.webp?v=r132" width="1280" height="800" alt="传香工坊，手作桌与方灯" data-current="proof/workshop-wide-preview.webp?v=r132" data-large="proof/workshop-wide.jpg?v=r132" data-prior="proof/base-workshop-wide.jpg?v=r132" data-currentalt="传香工坊，手作桌与方灯" data-prioralt="传香工坊，手作桌与方灯（上版）"></a>
              <figcaption class="caption"><div><h3>手作桌与方灯</h3><p data-note data-current="细金属框围合双层灯罩，灯下是原有的操作桌。" data-prior="上版的单层方灯与操作桌。">细金属框围合双层灯罩，灯下是原有的操作桌。</p>
              <a class="original" href="proof/workshop-wide.jpg?v=r132">查看原图</a>　<a class="lamp-zoom" href="proof/pendant.jpg?v=r132">放大方灯</a></div>
              <div class="switch" role="group" aria-label="手作桌与方灯同机位比较"><button type="button" data-which="current" aria-pressed="true">本次</button><button type="button" data-which="prior" aria-pressed="false">上版</button></div></figcaption>
              </figure><figure data-view="workshop-detail">
              <a class="art" href="proof/workshop-detail.jpg?v=r132" aria-label="查看工序工具柜原图"><img src="proof/workshop-detail-preview.webp?v=r132" width="1280" height="800" alt="传香工坊，工序工具柜" data-current="proof/workshop-detail-preview.webp?v=r132" data-large="proof/workshop-detail.jpg?v=r132" data-prior="proof/base-workshop-detail.jpg?v=r132" data-currentalt="传香工坊，工序工具柜" data-prioralt="传香工坊，工序工具柜（上版）"></a>
              <figcaption class="caption"><div><h3>工序工具柜</h3><p data-note data-current="层板前沿的灯光落在香匙、篆模和木托上。" data-prior="上版工序柜的层板照明。">层板前沿的灯光落在香匙、篆模和木托上。</p>
              <a class="original" href="proof/workshop-detail.jpg?v=r132">查看原图</a></div>
              <div class="switch" role="group" aria-label="工序工具柜同机位比较"><button type="button" data-which="current" aria-pressed="true">本次</button><button type="button" data-which="prior" aria-pressed="false">上版</button></div></figcaption>
              </figure></div></section>
</main>
<script>
for(const group of document.querySelectorAll('.switch')){
  const figure=group.closest('figure'),link=figure.querySelector('.art'),img=link.querySelector('img'),original=figure.querySelector('.original');
  for(const btn of group.querySelectorAll('button')){
    btn.onclick=()=>{
      const prior=btn.dataset.which==='prior';img.src=prior?img.dataset.prior:img.dataset.current;
      img.alt=prior?img.dataset.prioralt:img.dataset.currentalt;link.href=prior?img.dataset.prior:img.dataset.large;original.href=link.href;
      const note=figure.querySelector('[data-note]'),zoom=figure.querySelector('.lamp-zoom');
      note.textContent=prior?note.dataset.prior:note.dataset.current;if(zoom)zoom.hidden=prior;
      for(const sibling of group.querySelectorAll('button'))sibling.setAttribute('aria-pressed',String(sibling===btn));
    };
  }
}
</script>
</body></html>
