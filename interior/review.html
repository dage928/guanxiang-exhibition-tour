<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f1e9"><title>展品照明审核 · 莞香入庭</title>
<style>
:root{color-scheme:light;--paper:#f5f1e9;--ink:#302c25;--muted:#625c51;--rule:#cec6b8;--accent:#513d2e;--serif:"Songti SC","SimSun","Noto Serif CJK SC",serif}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--paper);color:var(--ink)}a{color:inherit;text-underline-offset:.24em}a:focus-visible,button:focus-visible{outline:3px solid #986434;outline-offset:3px}header,main{width:min(1720px,100%);margin:auto;padding-inline:clamp(16px,3.8vw,70px)}header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-block:17px;border-bottom:1px solid var(--rule)}.brand{font:600 clamp(21px,2.3vw,28px)/1.2 var(--serif);letter-spacing:.12em}header a{font-size:14px}main{padding-bottom:50px}.heading{padding-block:clamp(24px,3vw,48px) 20px}.heading p,p{color:var(--muted);margin:7px 0 0;font-size:clamp(14px,1.1vw,17px)}h1,h2,h3{margin:0;line-height:1.25}h1{font:600 clamp(33px,3.5vw,58px)/1.2 var(--serif);letter-spacing:.04em}h2{font:600 clamp(23px,2.2vw,35px)/1.3 var(--serif)}h3{font-size:17px;font-weight:600}.room{padding:20px 0 32px;border-top:1px solid var(--rule)}.roomhead{display:flex;align-items:baseline;gap:17px;margin-bottom:14px}.roomhead p{margin:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.3vw,24px)}figure{margin:0;min-width:0}.art{display:block;background:#e6dfd3;border-radius:2px;overflow:hidden}.art img{display:block;width:100%;height:auto;aspect-ratio:8/5}.caption{display:flex;justify-content:space-between;align-items:start;gap:12px;padding-top:11px}.caption p{font-size:14px}.switch{display:inline-flex;border:1px solid #aaa08f;border-radius:3px;white-space:nowrap;overflow:hidden;flex-shrink:0}.switch button{font:inherit;font-size:13px;color:var(--accent);padding:6px 10px;min-height:34px;background:transparent;border:0;cursor:pointer}.switch button[aria-pressed="true"]{background:#453e33;color:white}.original{font-size:13px;white-space:nowrap;line-height:2}.art:focus-visible{outline-offset:2px}.sr{position:absolute;clip-path:inset(50%);height:1px;width:1px;overflow:hidden}
@media(max-width:780px){.pair{grid-template-columns:1fr;gap:25px}.roomhead{display:block}.roomhead p{margin-top:4px}.heading{padding-bottom:20px}.room{padding-block:18px 25px}.caption{padding-top:9px}.switch button{min-height:40px}}
@media(max-width:410px){.caption{flex-wrap:wrap;gap:6px}.switch button{padding-inline:9px}.roomhead{margin-bottom:9px}}
</style>
</head>
<body><header><span class="brand">莞香入庭</span><a href="./">现有三维环视</a></header>
<main><div class="heading"><h1>展品照明审核</h1><p>四张原生渲染，4096 × 2560 像素。点开图片可看原图，两张全景可切换上版同机位。</p></div>
<section class="room"><div class="roomhead"><h2>品香主厅</h2><p>中央山形熏炉与两侧青瓷各有独立投光。</p></div><div class="pair"><figure data-view="main-wide"><a class="art" aria-label="查看主展台与两侧青瓷原图" href="proof/main-wide.jpg"><img width="1280" height="800" src="proof/main-wide-preview.webp" data-current="proof/main-wide-preview.webp" data-large="proof/main-wide.jpg" data-prior="proof/main-after.jpg" data-currentalt="品香主厅，主展台与两侧青瓷" data-prioralt="品香主厅上版同机位" alt="品香主厅，主展台与两侧青瓷"></a><figcaption class="caption"><div><h3>主展台与两侧青瓷</h3><p>留意背景的亮度与青瓷口沿的釉光。 <a class="original" href="proof/main-wide.jpg">查看原图</a></p></div><div class="switch" role="group" aria-label="品香主厅同机位比较"><button type="button" data-which="current" aria-pressed="true">本次</button><button type="button" data-which="prior" aria-pressed="false">上版</button></div></figcaption></figure><figure data-view="main-detail"><a class="art" aria-label="查看山形熏炉原图" href="proof/main-detail.jpg"><img width="1280" height="800" src="proof/main-detail-preview.webp" data-current="proof/main-detail-preview.webp" data-large="proof/main-detail.jpg" data-prior="" data-currentalt="品香主厅，山形熏炉" data-prioralt="品香主厅上版同机位" alt="品香主厅，山形熏炉"></a><figcaption class="caption"><div><h3>山形熏炉</h3><p>近看山形盖的透烟孔、铜面和三足落点。 <a class="original" href="proof/main-detail.jpg">查看原图</a></p></div></figcaption></figure></div></section>
<section class="room"><div class="roomhead"><h2>传香工坊</h2><p>上、下层板前沿向柜内投光，方灯照亮操作桌。</p></div><div class="pair"><figure data-view="workshop-wide"><a class="art" aria-label="查看手作桌与工序柜原图" href="proof/workshop-wide.jpg"><img width="1280" height="800" src="proof/workshop-wide-preview.webp" data-current="proof/workshop-wide-preview.webp" data-large="proof/workshop-wide.jpg" data-prior="proof/cra-after.jpg" data-currentalt="传香工坊，手作桌与工序柜" data-prioralt="传香工坊上版同机位" alt="传香工坊，手作桌与工序柜"></a><figcaption class="caption"><div><h3>手作桌与工序柜</h3><p>对照方灯、木桌与后方两层陈列的亮度。 <a class="original" href="proof/workshop-wide.jpg">查看原图</a></p></div><div class="switch" role="group" aria-label="传香工坊同机位比较"><button type="button" data-which="current" aria-pressed="true">本次</button><button type="button" data-which="prior" aria-pressed="false">上版</button></div></figcaption></figure><figure data-view="workshop-detail"><a class="art" aria-label="查看工具柜上层原图" href="proof/workshop-detail.jpg"><img width="1280" height="800" src="proof/workshop-detail-preview.webp" data-current="proof/workshop-detail-preview.webp" data-large="proof/workshop-detail.jpg" data-prior="" data-currentalt="传香工坊，工具柜上层" data-prioralt="传香工坊上版同机位" alt="传香工坊，工具柜上层"></a><figcaption class="caption"><div><h3>工具柜上层</h3><p>近看香匙、篆模和木托之间的接触阴影。 <a class="original" href="proof/workshop-detail.jpg">查看原图</a></p></div></figcaption></figure></div></section>
</main>
<script>
for(const group of document.querySelectorAll('.switch')){
  const figure=group.closest('figure'),link=figure.querySelector('.art'),img=link.querySelector('img'),original=figure.querySelector('.original');
  for(const btn of group.querySelectorAll('button')){
    btn.onclick=()=>{
      const prior=btn.dataset.which==='prior';img.src=prior?img.dataset.prior:img.dataset.current;
      img.alt=prior?img.dataset.prioralt:img.dataset.currentalt;link.href=prior?img.dataset.prior:img.dataset.large;original.href=link.href;
      for(const sibling of group.querySelectorAll('button'))sibling.setAttribute('aria-pressed',String(sibling===btn));
    };
  }
}
</script>
</body></html>
