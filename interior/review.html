<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f1e9"><title>午后庭光与香篆手作 · 莞香入庭</title>
<style>
:root{color-scheme:light;--paper:#f5f1e9;--ink:#302c25;--muted:#625c51;--rule:#cec6b8;--accent:#513d2e;--serif:"Songti SC","SimSun","Noto Serif CJK SC",serif}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--paper);color:var(--ink)}a{color:inherit;text-underline-offset:.24em}a:focus-visible,button:focus-visible{outline:3px solid #986434;outline-offset:3px}header,main{width:min(1720px,100%);margin:auto;padding-inline:clamp(16px,3.8vw,70px)}header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-block:17px;border-bottom:1px solid var(--rule)}.brand{font:600 clamp(21px,2.3vw,28px)/1.2 var(--serif);letter-spacing:.12em}header a{font-size:14px}main{padding-bottom:50px}.heading{padding-block:clamp(24px,3vw,48px) 20px}.heading p,p{color:var(--muted);margin:7px 0 0;font-size:clamp(14px,1.1vw,17px)}h1,h2,h3{margin:0;line-height:1.25}h1{font:600 clamp(33px,3.5vw,58px)/1.2 var(--serif);letter-spacing:.04em}h2{font:600 clamp(23px,2.2vw,35px)/1.3 var(--serif)}h3{font-size:17px;font-weight:600}.room{padding:20px 0 32px;border-top:1px solid var(--rule)}.roomhead{display:flex;align-items:baseline;gap:17px;margin-bottom:14px}.roomhead p{margin:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.3vw,24px)}figure{margin:0;min-width:0}.art{display:block;background:#e6dfd3;border-radius:2px;overflow:hidden}.art img{display:block;width:100%;height:auto;aspect-ratio:8/5}.caption{display:flex;justify-content:space-between;align-items:start;gap:12px;padding-top:11px}.caption p{font-size:14px}.switch{display:inline-flex;border:1px solid #aaa08f;border-radius:3px;white-space:nowrap;overflow:hidden;flex-shrink:0}.switch button{font:inherit;font-size:13px;color:var(--accent);padding:6px 10px;min-height:34px;background:transparent;border:0;cursor:pointer}.switch button[aria-pressed="true"]{background:#453e33;color:white}.lamp-zoom{font-size:13px}.original{font-size:13px;white-space:nowrap;line-height:2}.art:focus-visible{outline-offset:2px}.sr{position:absolute;clip-path:inset(50%);height:1px;width:1px;overflow:hidden}
@media(max-width:780px){.pair{grid-template-columns:1fr;gap:25px}.roomhead{display:block}.roomhead p{margin-top:4px}.heading{padding-bottom:20px}.room{padding-block:18px 25px}.caption{padding-top:9px}.switch button{min-height:40px}}
@media(max-width:410px){.caption{flex-wrap:wrap;gap:6px}.switch button{padding-inline:9px}.roomhead{margin-bottom:9px}}

.craft-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1fr);gap:clamp(20px,2vw,36px);align-items:start}
.craft-grid figure:first-child{grid-column:1;grid-row:1/span 2}
.craft-grid figure:not(:first-child){grid-column:2}
figure[data-view="seal-table"] .art img{aspect-ratio:4/5}
.caption .original{display:inline-block;margin-block:4px}
@media(max-width:780px){.craft-grid{grid-template-columns:1fr;gap:27px}.craft-grid figure:first-child,.craft-grid figure:not(:first-child){grid-column:auto;grid-row:auto}}
</style>
</head>
<body><header><span class="brand">莞香入庭</span><a href="model.html">三维模型环视</a></header>
<main><div class="heading"><h1>午后庭光与香篆手作</h1><p>点开照片可看原图。四个原有机位支持上版对照，桌边竖幅为本次新增视角。</p></div>
<section class="room"><div class="roomhead"><h2>传香工坊</h2></div><div class="craft-grid"><figure data-view="seal-table"><a class="art" href="proof/seal-table.jpg?v=r134" aria-label="查看香篆脱模之后原图">
        <img width="1040" height="1300" src="proof/seal-table-preview.webp?v=r134" alt="香篆脱模之后" data-current="proof/seal-table-preview.webp?v=r134" data-large="proof/seal-table.jpg?v=r134" data-currentalt="香篆脱模之后"></a>
        <figcaption class="caption"><div><h3>香篆脱模之后</h3><p data-note data-current="铜模已提起，灰面留下一道连续的四瓣香篆。香匙靠在罐口，模边还有少量落粉。">铜模已提起，灰面留下一道连续的四瓣香篆。香匙靠在罐口，模边还有少量落粉。</p><a class="original" href="proof/seal-table.jpg?v=r134">查看原图</a>　<a class="original tool-detail" href="proof/seal-detail.jpg?v=r134">看香篆与铜模细节</a></div></figcaption></figure><figure data-view="workshop-wide"><a class="art" href="proof/workshop-wide.jpg?v=r134" aria-label="查看八席手作长桌原图">
        <img width="1280" height="800" src="proof/workshop-wide-preview.webp?v=r134" alt="八席手作长桌" data-current="proof/workshop-wide-preview.webp?v=r134" data-large="proof/workshop-wide.jpg?v=r134" data-currentalt="八席手作长桌" data-prior="proof/base-workshop-wide.jpg?v=r134" data-prioralt="上版八席手作长桌"></a>
        <figcaption class="caption"><div><h3>八席手作长桌</h3><p data-note data-current="庭院侧光穿过工坊门洞，沿木桌依次照到脱模、理灰和备料三处。" data-prior="上版的日间工坊与八席操作桌。">庭院侧光穿过工坊门洞，沿木桌依次照到脱模、理灰和备料三处。</p><a class="original" href="proof/workshop-wide.jpg?v=r134">查看原图</a></div><div class="switch" role="group" aria-label="八席手作长桌同机位比较"><button type="button" data-which="current" aria-pressed="true">本次</button><button type="button" data-which="prior" aria-pressed="false">上版</button></div></figcaption></figure><figure data-view="workshop-detail"><a class="art" href="proof/workshop-detail.jpg?v=r134" aria-label="查看手作工具柜原图">
        <img width="1280" height="800" src="proof/workshop-detail-preview.webp?v=r134" alt="手作工具柜" data-current="proof/workshop-detail-preview.webp?v=r134" data-large="proof/workshop-detail.jpg?v=r134" data-currentalt="手作工具柜" data-prior="proof/base-workshop-detail.jpg?v=r134" data-prioralt="上版手作工具柜"></a>
        <figcaption class="caption"><div><h3>手作工具柜</h3><p data-note data-current="层板下的光落在木托和金属工具上，柜内保留了较暗的背衬。" data-prior="上版工序柜的层板与工具。">层板下的光落在木托和金属工具上，柜内保留了较暗的背衬。</p><a class="original" href="proof/workshop-detail.jpg?v=r134">查看原图</a></div><div class="switch" role="group" aria-label="手作工具柜同机位比较"><button type="button" data-which="current" aria-pressed="true">本次</button><button type="button" data-which="prior" aria-pressed="false">上版</button></div></figcaption></figure></div></section><section class="room"><div class="roomhead"><h2>品香主厅</h2></div><div class="pair"><figure data-view="main-wide"><a class="art" href="proof/main-wide.jpg?v=r134" aria-label="查看品香主厅原图">
        <img width="1280" height="800" src="proof/main-wide-preview.webp?v=r134" alt="品香主厅" data-current="proof/main-wide-preview.webp?v=r134" data-large="proof/main-wide.jpg?v=r134" data-currentalt="品香主厅" data-prior="proof/base-main-wide.jpg?v=r134" data-prioralt="上版品香主厅"></a>
        <figcaption class="caption"><div><h3>品香主厅</h3><p data-note data-current="庭院窗光从一侧照亮中央展台，两侧展柜的层板与后墙依次受光。" data-prior="上版的庭院天光、中央展台与两侧吊灯。">庭院窗光从一侧照亮中央展台，两侧展柜的层板与后墙依次受光。</p><a class="original" href="proof/main-wide.jpg?v=r134">查看原图</a></div><div class="switch" role="group" aria-label="品香主厅同机位比较"><button type="button" data-which="current" aria-pressed="true">本次</button><button type="button" data-which="prior" aria-pressed="false">上版</button></div></figcaption></figure><figure data-view="main-detail"><a class="art" href="proof/main-detail.jpg?v=r134" aria-label="查看山形熏炉原图">
        <img width="1280" height="800" src="proof/main-detail-preview.webp?v=r134" alt="山形熏炉" data-current="proof/main-detail-preview.webp?v=r134" data-large="proof/main-detail.jpg?v=r134" data-currentalt="山形熏炉" data-prior="proof/base-main-detail.jpg?v=r134" data-prioralt="上版山形熏炉"></a>
        <figcaption class="caption"><div><h3>山形熏炉</h3><p data-note data-current="沿炉盖的山脊看向透烟孔，铜身上的暖金反射过渡到青褐色。" data-prior="上版日间光线下的山形熏炉。">沿炉盖的山脊看向透烟孔，铜身上的暖金反射过渡到青褐色。</p><a class="original" href="proof/main-detail.jpg?v=r134">查看原图</a></div><div class="switch" role="group" aria-label="山形熏炉同机位比较"><button type="button" data-which="current" aria-pressed="true">本次</button><button type="button" data-which="prior" aria-pressed="false">上版</button></div></figcaption></figure></div></section>
</main>
<script>
for(const group of document.querySelectorAll('.switch')){
  const figure=group.closest('figure'),link=figure.querySelector('.art'),img=link.querySelector('img'),original=figure.querySelector('.original');
  for(const btn of group.querySelectorAll('button')){
    btn.onclick=()=>{
      const prior=btn.dataset.which==='prior';img.src=prior?img.dataset.prior:img.dataset.current;
      img.alt=prior?img.dataset.prioralt:img.dataset.currentalt;link.href=prior?img.dataset.prior:img.dataset.large;original.href=link.href;
      const note=figure.querySelector('[data-note]'),zoom=figure.querySelector('.lamp-zoom');
      note.textContent=prior?note.dataset.prior:note.dataset.current;if(zoom)zoom.hidden=prior;
      for(const sibling of group.querySelectorAll('button'))sibling.setAttribute('aria-pressed',String(sibling===btn));
    };
  }
}
</script>
</body></html>
