<style>:root{color-scheme:light;--paper:#f2eee3;--ink:#29352c;--muted:#596451;--rule:#c9c5b6;--measure:1150px;font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--paper);color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
.shell{width:min(var(--measure),calc(100% - clamp(32px,8vw,104px)));margin-inline:auto}
header{border-bottom:1px solid var(--rule)}
.head,.title-line,.actions,figcaption,.tour-nav,footer,.light-head{display:flex;align-items:center}
.head{justify-content:space-between;min-height:65px;gap:14px}
a{color:var(--ink);text-underline-offset:4px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font:600 24px/1.15 SimSun,"Songti SC","Noto Serif CJK SC",serif;letter-spacing:.08em}
.seal{font:18px SimSun,serif;border:1px solid #985340;color:#934a37;padding:1px 3px;border-radius:2px}
.picker{display:flex;align-items:center;gap:9px}
.picker label,footer{font-size:13px;color:var(--muted)}
button,select{font:inherit;color:inherit}
button,select,a{touch-action:manipulation}
select{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:0 8px;min-height:42px;max-width:47vw;cursor:pointer}
button{min-height:44px;border:1px solid var(--rule);border-radius:3px;background:transparent;cursor:pointer;padding:0 15px}
button:hover{background:#e5e2d6}
:focus-visible{outline:3px solid #997042;outline-offset:3px}
.title-line{justify-content:space-between;align-items:baseline;gap:12px;margin:clamp(16px,3.3vh,35px) 0 13px}
h1{font:500 clamp(28px,4vw,52px)/1.22 SimSun,"Songti SC",serif;margin:0;letter-spacing:.07em}
#count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.05em}
figure{margin:0}
#stage{--ratio:1.5;position:relative;isolation:isolate;overflow:hidden;width:100%;height:clamp(140px,calc(min(var(--measure),100vw - clamp(32px,8vw,104px)) / var(--ratio)),min(68svh,760px));background:#252820;touch-action:pan-y;user-select:none;outline-offset:2px}
#stage.has-orbit{cursor:grab}
#stage[data-mode="panorama"]{height:clamp(285px,64svh,730px);touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage:fullscreen,#stage.expanded{height:100%!important;width:100%!important;background:#191b15}
#stage.expanded{position:fixed;inset:0;z-index:1000;height:100dvh!important}
body.expanded{overflow:hidden}
#photo{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}
#camera{display:none;position:absolute;inset:0;perspective-origin:50% 50%;pointer-events:none;background:#454638;overflow:hidden}
#stage[data-mode="panorama"] #camera{display:block}
#world{position:absolute;top:50%;left:50%;width:0;height:0;transform-style:preserve-3d}
.face{position:absolute;left:-384px;top:-384px;width:768px;height:768px;background-size:300% 200%;background-repeat:no-repeat;backface-visibility:hidden}
.expand{position:absolute;right:10px;top:10px;color:#fff;border-color:#ffffff68;background:#17231b99;width:42px;min-height:40px;padding:7px;display:grid;place-items:center}
.expand:hover{background:#19241bdd}
.expand svg{width:19px;height:19px}
#feedback{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:7px 12px;background:#1b261fec;color:#fff;border-radius:3px;font-size:14px;max-width:90%;width:max-content}
#retry{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper)}
figcaption{justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.actions{gap:8px}
.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.primary:hover{background:#414e40}
#hint{font-size:13px;color:var(--muted);line-height:1.55}
.tour-nav{margin-top:clamp(18px,3vh,32px);border-block:1px solid var(--rule);justify-content:space-between;gap:12px}
.tour-nav button{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:0;padding:11px 4px;background:transparent}
.tour-nav button:last-child{text-align:right}
.tour-nav b,.tour-nav small{display:block}
.tour-nav b{font:500 18px/1.5 SimSun,"Songti SC",serif}
.tour-nav small{font-size:11px;color:var(--muted)}
.tour-nav button:hover b,footer a:hover{text-decoration:underline}
footer{justify-content:space-between;gap:12px;padding:15px 0 22px}
footer a{color:var(--muted);padding-block:5px}
dialog{padding:0;border:1px solid var(--rule);max-width:96vw;width:1100px;max-height:95dvh;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:#171e19de}
dialog:not([open]){display:none}
.light-head{justify-content:space-between;gap:12px;padding:6px 12px}
.light-head strong{font:500 20px SimSun,serif}
.zoom-scroll{overflow:auto;background:#292b23;text-align:center}
#large{display:block;max-width:100%;max-height:74dvh;width:auto;height:auto;margin:auto;cursor:zoom-in}
#large.enlarged{width:auto;height:auto;max-height:none;max-width:none;cursor:zoom-out}
#lightStatus{font-size:13px;margin:8px 12px 12px}
.light-foot{display:flex;justify-content:space-between;gap:2px 12px;flex-wrap:wrap;align-items:baseline}
#native{font-size:13px;padding:8px 12px 12px;display:inline-block}
[hidden]{display:none!important}
@media(max-width:560px){.head{min-height:57px}.brand{font-size:22px}.picker label{display:none}.title-line{margin-top:22px}figcaption{align-items:flex-start;flex-direction:column;gap:9px}#hint{min-height:20px}.actions button{font-size:15px}.tour-nav{margin-top:16px}.expand{right:6px;top:6px}}
@media(max-height:470px) and (orientation:landscape){.head{min-height:48px}.title-line{margin:9px 0}#stage,#stage[data-mode="panorama"]{max-height:72svh}.tour-nav{margin-top:10px}}

<header><div class="shell head">

<main class="shell">

  <figure>

      <img id="photo" alt="" fetchpriority="high" draggable="false">
      <div id="camera" aria-hidden="true"><div id="world"><div class="face" style="transform:rotateY(0deg) translateZ(-383.85px);background-position:0% 0%"></div><div class="face" style="transform:rotateY(-90deg) translateZ(-383.85px);background-position:50% 0%"></div><div class="face" style="transform:rotateY(180deg) translateZ(-383.85px);background-position:100% 0%"></div><div class="face" style="transform:rotateY(90deg) translateZ(-383.85px);background-position:0% 100%"></div><div class="face" style="transform:rotateX(-90deg) translateZ(-383.85px);background-position:50% 100%"></div><div class="face" style="transform:rotateX(90deg) translateZ(-383.85px);background-position:100% 100%"></div></div></div>

    </div>
    <figcaption><div class="actions">
      <button type="button" id="mode" class="primary" hidden><span aria-hidden="true">⟲</span> <span id="modeText">环视此处</span></button>

  <nav class="tour-nav" aria-label="切换展区">

    <button id="next" type="button"><span><small>下一处</small><b id="nextTitle"></b></span><span aria-hidden="true">→</span></button>
  </nav>
  <footer><a href="../#board">查看完整展板</a><a id="modelLink" href="model.html">打开三维模型</a></footer>

</main>
<dialog id="lightbox"><div class="light-head"><strong id="lightTitle"></strong><button id="closeLight" type="button">关闭</button></div>
  <div class="zoom-scroll"><img id="large" alt=""></div><div class="light-foot"><p id="lightStatus" role="status"></p><a id="native" target="_blank" rel="noopener">打开原尺寸图</a></div>
</dialog>
<script>const rooms=[{"id":"MAIN","title":"品香主厅","width":832,"height":555,"small":"main-small.webp","detail":"main-detail.webp","surround":"main-surround.webp","original":"../photos/gallery-8k-r112.jpg","pixels":[7680,5120]},{"id":"CRA","title":"传香工坊","width":832,"height":555,"small":"cra-small.webp","detail":"cra-detail.webp","surround":"cra-surround.webp","original":"../photos/craft-8k-r113.jpg","pixels":[7680,5120]},{"id":"GARDEN","title":"香庭回廊","width":832,"height":555,"small":"garden-small.webp","detail":"garden-detail.webp","surround":"garden-surround.webp","original":"../photos/courtyard-8k-r112.jpg","pixels":[7680,5120]},{"id":"RET","title":"文创陈列","width":832,"height":555,"small":"ret-small.webp","detail":"ret-detail.webp","surround":"ret-surround.webp","original":"../photos/retail-8k-r113.jpg","pixels":[7680,5120]},{"id":"CAF","title":"庭院咖啡","width":555,"height":832,"small":"caf-small.webp","detail":"caf-detail.webp","surround":"caf-surround.webp","original":"../photos/cafe-8k-r113.jpg","pixels":[5120,7680]},{"id":"SMELL","title":"闻香空间","width":832,"height":832,"small":"smell-small.webp","detail":"smell-detail.webp","surround":"smell-surround.webp","original":"../photos/smell-8k-r113.jpg","pixels":[7680,7680]},{"id":"BOT","title":"识香展陈","width":832,"height":555,"small":"bot-small.webp","detail":"bot-detail.webp","surround":"bot-surround.webp","original":"../photos/bot-8k-r113.jpg","pixels":[7680,5120]},{"id":"HIS","title":"寻香展陈","width":832,"height":555,"small":"his-small.webp","detail":"his-detail.webp","surround":"his-surround.webp","original":"../photos/origin-8k-r113.jpg","pixels":[7680,5120]},{"id":"ENT","title":"门厅序厅","width":832,"height":555,"small":"ent-small.webp","detail":"ent-detail.webp","surround":"ent-surround.webp","original":"../photos/entry-8k-r113.jpg","pixels":[7680,5120]},{"id":"STREET","title":"展馆临街外观","width":832,"height":277,"small":"street-small.webp","detail":"street-detail.webp","surround":"street-surround.webp","original":"../photos/original-exterior-panorama.png","pixels":[2172,724]},{"id":"ALL","title":"叠院香阁鸟瞰","width":832,"height":326,"small":"all-small.webp","detail":"all-detail.webp","surround":"all-surround.webp","original":"../photos/exterior-8k-r113.jpg","pixels":[7680,3010]}];</script>
<script>'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), photo = $('photo'), camera = $('camera'), world = $('world');
const selector = $('rooms'), light = $('lightbox'), large = $('large');
const directory = 'board-views/';
const geometryUrl = new URL($('modelLink').href);
const allowOrbit = CSS.supports('transform-style', 'preserve-3d');
let index = 0, photoVersion = 0, modeVersion = 0, requestMode = false;
let yaw = 0, pitch = 0, zoom = 1, drawId = 0, detailVersion = 0;
let distance = 0, horizontalTravel = 0, startX = 0, startY = 0, modeAtStart = '';
const pointers = new Map();
const clamp = (n,lo,hi) => Math.max(lo,Math.min(hi,n));
const scene = () => rooms[index];
const orbit = () => stage.dataset.mode === 'panorama';
const hasOrbit = () => Boolean(scene().surround && allowOrbit);
const wrap = i => (i % rooms.length + rooms.length) % rooms.length;
const aliases = {WOR:'CRA',COURT:'GARDEN',COURTYARD:'GARDEN',COUR:'GARDEN',GAR:'GARDEN',OUT:'ALL',ORIGIN:'HIS',SME:'SMELL',FRONT:'ENT',CAFE:'CAF'};

function selectedFromUrl() {
  const value = (new URLSearchParams(location.search).get('room') || 'MAIN').toUpperCase();
  const found = rooms.findIndex(r => r.id === (aliases[value] || value));
  return found < 0 ? 0 : found;
}
function notice(message='') {
  $('feedback').hidden = !message;
  $('feedback').textContent = message;
}
function modeControls() {
  $('mode').hidden = !hasOrbit();
  $('modeText').textContent = orbit() || requestMode ? '回到展板原图' : '环视此处';
  $('mode').setAttribute('aria-pressed', String(orbit() || requestMode));
  $('hint').textContent = orbit() ? '拖动转向，双指缩放。周围视角依展板补绘。' :
    (hasOrbit() ? '左右拖动可进入环视。' : '左右滑动可切换展区。');
  stage.classList.toggle('has-orbit',hasOrbit());
}
function showPhoto() {
  ++modeVersion;
  requestMode = false;
  stage.dataset.mode = 'photo';
  yaw = 0; pitch = 0; zoom = 1;
  notice(); modeControls();
}
function choose(i,updateUrl=true) {
  index = wrap(i);
  const item = scene(), version = ++photoVersion;
  pointers.clear();
  closeLight();
  showPhoto();
  stage.dataset.room = item.id;
  $('retry').hidden=true;
  document.documentElement.dataset.ready = 'false';
  $('title').textContent = item.title;
  document.title = item.title+' · 莞香入庭';
  selector.value = item.id;
  $('count').textContent = String(index+1).padStart(2,'0')+' / '+String(rooms.length).padStart(2,'0');
  const model=new URL(geometryUrl);
  model.searchParams.set('room', ['ALL','STREET'].includes(item.id) ? 'ENT' : item.id);
  $('modelLink').href=model.href;
  $('prevTitle').textContent = rooms[wrap(index-1)].title;
  $('nextTitle').textContent = rooms[wrap(index+1)].title;
  stage.style.setProperty('--ratio',String(item.width/item.height));
  stage.setAttribute('aria-label',item.title+'，用左右方向键浏览，回车切换环视');
  photo.alt = item.title+' · 展板效果图';
  photo.onload = () => {
    const ready = () => {
      if(version === photoVersion) document.documentElement.dataset.ready = 'true';
    };
    if(photo.decode) photo.decode().then(ready,ready);
    else ready();
  };
  photo.onerror = () => {
    if(version!==photoVersion) return;
    $('retry').hidden=false;
    notice('这张原图暂时未载入。');
  };
  photo.src = directory+item.small;
  if(updateUrl && location.protocol !== 'file:') {
    const url = new URL(location.href);
    url.searchParams.set('room',item.id);
    if(url.href!==location.href) history.pushState(null,'',url);
  }
}
function frame() {
  drawId=0;
  if(!orbit()) return;
  const w=stage.clientWidth, h=stage.clientHeight;
  const f=Math.max(w*.5/Math.tan(52*Math.PI/180),h*.5/Math.tan(38*Math.PI/180))*zoom;
  camera.style.perspective=f+'px';
  world.style.transform='translateZ('+f+'px) rotateX('+pitch+'deg) rotateY('+yaw+'deg)';
  stage.dataset.yaw=String(Math.round(yaw*10)/10);
  stage.dataset.pitch=String(Math.round(pitch*10)/10);
  stage.dataset.zoom=String(Math.round(zoom*100)/100);
}
function queueFrame() { if(!drawId) drawId=requestAnimationFrame(frame); }
function rotate(dx,dy) {
  const step=clamp(104/stage.clientWidth,.09,.25)/zoom;
  yaw=(yaw-dx*step+360)%360;
  pitch=clamp(pitch+dy*step,-89,89);
  queueFrame();
}
function beginOrbit() {
  if(!hasOrbit() || requestMode || orbit()) return;
  const version=++modeVersion, item=scene(), texture=new Image();
  requestMode=true;notice('正在打开环视…');modeControls();
  texture.onload=async () => {
    if(texture.decode) { try{await texture.decode();}catch{} }
    if(version!==modeVersion || item!==scene()) return;
    const url='url("'+directory+item.surround+'")';
    for(const face of world.children) face.style.backgroundImage=url;
    // Keep the decoded image alive while its six faces are displayed.
    camera.texture=texture;
    requestMode=false;
    stage.dataset.mode='panorama';notice();modeControls();frame();
  };
  texture.onerror=() => {
    if(version!==modeVersion) return;
    showPhoto();notice('环视暂时未载入，可再点一次“环视此处”。');
  };
  texture.src=directory+item.surround;
}
function toggleOrbit() {
  if(orbit() || requestMode) showPhoto();
  else beginOrbit();
}
function fingerDistance() {
  const [a,b]=pointers.values();
  return Math.hypot(a.x-b.x,a.y-b.y);
}
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button') || (e.pointerType==='mouse' && e.button!==0)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1) {
    startX=e.clientX;startY=e.clientY;horizontalTravel=0;modeAtStart=stage.dataset.mode;
  } else if(pointers.size===2) distance=fingerDistance();
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  const old=pointers.get(e.pointerId);
  if(!old) return;
  const dx=e.clientX-old.x,dy=e.clientY-old.y;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2) {
    const now=fingerDistance();
    if(orbit() && now && distance) { zoom=clamp(zoom*now/distance,.8,2.8);queueFrame(); }
    distance=now;
    return;
  }
  if(pointers.size!==1) return;
  horizontalTravel=e.clientX-startX;
  if(!orbit() && !requestMode && hasOrbit() && Math.abs(horizontalTravel)>9 &&
      Math.abs(horizontalTravel)>Math.abs(e.clientY-startY)) {
    beginOrbit();
    rotate(horizontalTravel,e.clientY-startY);
  } else if(orbit() || requestMode) rotate(dx,dy);
});
function releasePointer(e) {
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if(e.type==='pointerup' && !pointers.size && modeAtStart==='photo' && !hasOrbit() &&
     Math.abs(horizontalTravel)>42 && Math.abs(horizontalTravel)>Math.abs(e.clientY-startY)) {
    choose(index+(horizontalTravel<0 ? 1 : -1));
  }
  if(pointers.size===1) {
    const a=[...pointers.values()][0];startX=a.x;startY=a.y;horizontalTravel=0;
  }
}
stage.addEventListener('pointerup',releasePointer);
stage.addEventListener('pointercancel',releasePointer);
stage.addEventListener('lostpointercapture',releasePointer);
stage.addEventListener('wheel',e=>{
  if(!orbit() || e.ctrlKey) return;
  e.preventDefault();zoom=clamp(zoom*Math.exp(-.0015*e.deltaY),.8,2.8);queueFrame();
},{passive:false});
stage.addEventListener('keydown',e=>{
  if(e.target!==stage) return;
  if(e.key==='Enter' && hasOrbit()) {e.preventDefault();toggleOrbit();return;}
  if(e.key==='Escape') {if(stage.classList.contains('expanded')) toggleFull();else showPhoto();return;}
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key)) return;
  e.preventDefault();
  if(!orbit()) {
    if(e.key==='ArrowLeft') choose(index-1);
    if(e.key==='ArrowRight') choose(index+1);
    return;
  }
  if(e.key==='ArrowLeft') yaw=(yaw+345)%360;
  if(e.key==='ArrowRight') yaw=(yaw+15)%360;
  if(e.key==='ArrowUp') pitch=clamp(pitch+10,-89,89);
  if(e.key==='ArrowDown') pitch=clamp(pitch-10,-89,89);
  if(e.key==='Home') {yaw=0;pitch=0;zoom=1;}
  queueFrame();
});
function fullLabel() {
  const active=Boolean(document.fullscreenElement || stage.classList.contains('expanded'));
  $('fullscreen').setAttribute('aria-label',active?'退出全屏':'全屏观看');
  $('fullscreen').title=active?'退出全屏':'全屏观看';
  queueFrame();
}
async function toggleFull() {
  if(document.fullscreenElement) {await document.exitFullscreen();return;}
  if(!stage.classList.contains('expanded') && stage.requestFullscreen) {
    try {await stage.requestFullscreen();return;} catch {}
  }
  const active=stage.classList.toggle('expanded');document.body.classList.toggle('expanded',active);fullLabel();
}
function closeLight() {
  ++detailVersion;
  if(light.open && light.close) light.close();
  else light.removeAttribute('open');
  large.classList.remove('enlarged');
  large.removeAttribute('src');large.onload=null;large.onerror=null;
}
function openDetail() {
  const v=++detailVersion,item=scene();
  $('lightTitle').textContent=item.title+' · 展板原图';large.alt=item.title+'高清效果图';
  $('native').href=item.original;
  $('native').textContent='打开原尺寸图（'+item.pixels.join(' × ')+'）';
  $('lightStatus').textContent='正在打开高清原图…';
  if(light.showModal) light.showModal();else light.setAttribute('open','');
  large.onload=()=>{if(v===detailVersion)$('lightStatus').textContent='轻点图片可放大，再点一次可还原。';};
  large.onerror=()=>{if(v===detailVersion)$('lightStatus').textContent='图片暂时未载入，请关闭后重试。';};
  large.src=directory+item.detail;
}
selector.addEventListener('change',()=>choose(rooms.findIndex(r=>r.id===selector.value)));
$('prev').onclick=()=>choose(index-1);$('next').onclick=()=>choose(index+1);
$('retry').onclick=()=>choose(index,false);
$('mode').onclick=toggleOrbit;$('fullscreen').onclick=toggleFull;
$('detail').onclick=openDetail;$('closeLight').onclick=closeLight;
large.onclick=()=>large.classList.toggle('enlarged');
light.addEventListener('click',e=>{if(e.target===light) closeLight();});
window.addEventListener('popstate',()=>choose(selectedFromUrl(),false));
window.addEventListener('resize',queueFrame);
document.addEventListener('fullscreenchange',fullLabel);
if(window.ResizeObserver) new ResizeObserver(queueFrame).observe(stage);
const linkedRoom=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
if(['EXIT','SVC'].includes(linkedRoom)){
  // These two older room bookmarks only have model imagery.
  geometryUrl.searchParams.set('room',linkedRoom);location.replace(geometryUrl.href);
}else choose(selectedFromUrl(),false);
</script>
