<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3eb">
<title>室内三维导览 · 莞香入庭</title>
<style>:root{color-scheme:light;--paper:#f6f3eb;--ink:#253a32;--line:#d5d1c5;--subtle:#5d655b;--accent:#82472e;--serif:"Songti SC","STSong","SimSun",serif;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,select,a{touch-action:manipulation}button,a,select{color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,#surface:focus-visible{outline:3px solid #996047;outline-offset:2px}button:disabled{opacity:.45;cursor:wait}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mast{height:72px;padding:0 clamp(17px,2.6vw,48px);display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{font:600 clamp(23px,2.1vw,30px)/1 var(--serif);letter-spacing:.13em;white-space:nowrap}.mast-rule{height:19px;border-left:1px solid #a7ad9a}.mast h1{font-size:15px;letter-spacing:.07em;font-weight:500;margin:0}.back{margin-left:auto;text-decoration:none;font-size:14px;white-space:nowrap}.back:hover{text-decoration:underline}
.layout{display:grid;grid-template-columns:minmax(162px,208px) minmax(0,1fr);height:calc(100vh - 108px);height:calc(100dvh - 108px);min-height:460px}
.rail{padding:clamp(16px,2vh,28px) 18px 14px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto;scrollbar-width:thin;background:#f2efe6}
.rail h2,.plan-box h3{font:600 14px/1.5 var(--serif);margin:0;color:#596456;letter-spacing:.13em}
#room-list{display:flex;flex-direction:column;gap:2px;margin:12px 0 14px}#room-list button{background:transparent;border:0;text-align:left;line-height:1.3;padding:8px 12px;border-radius:2px;font-size:14px;position:relative}#room-list button:first-child{margin-bottom:4px;border-bottom:1px solid var(--line);border-radius:0;padding-bottom:12px}#room-list button:hover{background:#e4e4d8}#room-list button[aria-current="location"]{background:#dce1d2;color:#253d2f;font-weight:600}#room-list button[aria-current="location"]::before{content:"";position:absolute;left:0;top:25%;bottom:25%;width:3px;background:#55705b}.plan-box{border-top:1px solid var(--line);padding-top:12px;margin-top:auto}.plan-box canvas{width:100%;height:auto;display:block;cursor:pointer}
.mobile-rooms{display:none}.stage{position:relative;overflow:hidden;isolation:isolate;min-height:0;background:#dfded4}.stage:fullscreen{width:100%;height:100%;background:#dfded4}#surface{position:absolute;inset:0;touch-action:none;outline-offset:-4px;cursor:grab}#surface.moving{cursor:grabbing}#surface canvas{display:block;width:100%;height:100%;touch-action:none}.place-strip{position:absolute;inset:18px 20px auto 23px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}.place{padding:10px 14px 11px;background:rgba(247,245,237,.93);border-left:3px solid #798b72;box-shadow:0 1px 6px #554a3610}.place h2{font:600 clamp(20px,2vw,29px)/1.3 var(--serif);margin:0}.place p{font-size:13px;margin:3px 0 0;color:var(--subtle)}
.modes,.scene-tools,.ceiling{pointer-events:auto;background:rgba(249,247,239,.96);border:1px solid #adae9e;box-shadow:0 2px 7px #322c2019}.modes{padding:3px;display:flex;border-radius:3px}.modes button,.scene-tools button{border:0;border-radius:2px;background:transparent;font-size:14px;line-height:1.3;white-space:nowrap;padding:9px 12px}.modes button[aria-pressed="true"],.scene-tools button[aria-pressed="true"]{color:#fff;background:#374f42}.modes button:hover:not([aria-pressed="true"]),.scene-tools button:hover:not([aria-pressed="true"]){background:#dedfd1}
.scene-tools{position:absolute;right:20px;bottom:18px;display:flex;align-items:center;padding:3px;border-radius:3px}.zoom-group{display:flex;border-right:1px solid var(--line);padding-right:3px;margin-right:2px}.zoom-group button{font:22px/1 system-ui;min-width:34px;padding:5px}.ceiling{position:absolute;bottom:18px;left:20px;padding:8px 11px;border-radius:3px;font-size:13px;display:flex;align-items:center;gap:6px}.ceiling input{accent-color:#43614d}.ceiling[hidden],[hidden]{display:none!important}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:92%;padding:12px 18px;background:rgba(248,246,238,.95);border:1px solid var(--line);font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:3px}.status a{white-space:nowrap}.spinner{width:15px;height:15px;border:2px solid #c0c5b2;border-top-color:#506b55;border-radius:50%;animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
footer{height:36px;padding:0 clamp(15px,2.6vw,48px);display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);font-size:13px;color:var(--subtle)}.foot-title{font-family:var(--serif);letter-spacing:.12em}
@media(max-width:760px){.mast{height:60px;gap:12px}.mast h1{font-size:14px}.mast-rule{height:15px}.layout{display:flex;flex-direction:column;height:calc(100vh - 92px);height:calc(100dvh - 92px);min-height:380px}.rail{display:none}.mobile-rooms{display:flex;align-items:center;gap:12px;padding:7px 15px;border-bottom:1px solid var(--line);font-size:14px}.mobile-rooms label{color:var(--subtle)}.mobile-rooms select{flex:1;max-width:360px;min-width:0;height:35px;border:1px solid #aeaf9f;background:#faf8f1;padding:3px 9px;border-radius:2px}.stage{flex:1}.place-strip{inset:10px 9px auto 10px}.place{padding:6px 9px}.place h2{font-size:19px}.place p{display:none}.modes button{font-size:13px;padding:7px 8px}.scene-tools{bottom:11px;right:9px}.scene-tools button{min-height:38px;font-size:13px;padding:7px 9px}.zoom-group button{font-size:20px;min-width:35px}.ceiling{left:9px;bottom:62px;padding:5px 8px;font-size:12px}footer{height:32px;font-size:12px}.foot-title{display:none}}
@media(max-height:560px) and (min-width:761px){.mast{height:48px}.layout{height:calc(100dvh - 78px);min-height:300px}.rail{padding-top:10px}.place-strip{top:8px}.scene-tools,.ceiling{bottom:9px}footer{height:30px}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
.mast-links{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:14px;white-space:nowrap}.mast-links a{text-decoration:none}.mast-links a:hover{text-decoration:underline}
.sample-switch{padding:3px;gap:0}.sample-switch button{cursor:pointer;color:inherit;border:0;background:transparent;padding:9px 13px;border-radius:2px;font-size:14px}.sample-switch button[aria-pressed=true]{color:white;background:#594837}
@media(max-width:660px){.mast{gap:9px}.mast-links{gap:12px;font-size:13px}.sample-switch{padding:3px}.sample-switch button{font-size:13px;padding:8px 11px}}
@media(max-width:420px){.mast h1,.mast-rule{display:none}}
</style>
</head>
<body>
<header class="mast">
  <div class="brand">莞香入庭</div><span class="mast-rule"></span><h1>室内三维导览</h1>
  <nav class="mast-links"><a href="review.html">同机位对比</a><a href="../#board">完整展板<span aria-hidden="true"> ↗</span></a></nav>
</header>
<main class="layout">
  <aside class="rail" aria-label="空间导览">
    <h2>空间导览</h2>
    <nav id="room-list" aria-label="选择查看空间"></nav>
    <div class="plan-box">
      <h3>馆内定位</h3>
      <canvas id="floorplan" width="380" height="290" aria-label="馆内平面与当前所选位置"></canvas>
    </div>
  </aside>
  <div class="mobile-rooms"><label for="room-picker">空间导览</label><select id="room-picker" aria-label="选择查看空间"></select></div>
  <section class="stage" id="stage" aria-label="可交互三维室内模型">
    <div id="surface" role="application" tabindex="0" aria-label="三维视窗。方向键转向，加减键缩放，Home 复位。"></div>
    <div class="place-strip">
      <div class="place"><h2 id="place-title">全馆鸟瞰</h2><p id="place-detail">庭院与各展厅的围合关系</p></div>
      <div class="modes" role="group" aria-label="观察方式">
        <button type="button" id="orbit" aria-pressed="true">模型环绕</button><button type="button" id="eye" aria-pressed="false">原地环视</button>
      </div>
    </div>
    <div class="status" role="status" id="load-status"><span class="spinner" aria-hidden="true"></span><span id="load-text">正在打开室内模型…</span></div>
    <div class="scene-tools">
      <div class="zoom-group" role="group" aria-label="缩放"><button id="plus" type="button" aria-label="放大" title="放大">＋</button><button id="minus" type="button" aria-label="缩小" title="缩小">−</button></div>
      <button id="reset" type="button">复位</button><button id="auto" type="button" aria-pressed="false">自动环绕</button><button id="full" type="button">全屏</button>
    </div>
    <label id="ceiling-control" class="ceiling"><input id="ceiling" type="checkbox">寻香厅天花</label>
    <div id="sample-control" class="ceiling sample-switch" role="group" aria-label="切换同机位灯光方案" hidden>
      <button id="sample-before" type="button" aria-pressed="false">原方案</button>
      <button id="sample-after" type="button" aria-pressed="true">暖光样板</button>
    </div>
    <span id="announcement" class="sr" aria-live="polite"></span>
  </section>
</main>
<footer><span id="gesture">拖动旋转 · 滚轮缩放 · 右键平移</span><span class="foot-title">莞香文化展馆</span></footer>
<noscript>浏览三维场景需要启用 JavaScript。</noscript>

<script src="app.js?v=r130b"></script>
</body>
</html>
