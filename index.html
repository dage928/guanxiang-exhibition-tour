<section id="mainhall"><h2>香器主厅 · 林泉香境</h2><p class="sample-intro">连续林泉雕刻、暖浅色墙面与深木构架相接；圆角藻井和悬挂香灯回应重点香器，展台保留多方向观看空间。</p><div class="gallery"><figure><a href="效果预览/S01_主厅入口.jpg?v=r10-20261012"><img src="效果预览/S01_主厅入口.jpg?v=r10-20261012" width="1600" height="1100" loading="lazy" alt="从入口看向香器与林泉主墙"></a><figcaption><span>从入口看向香器与林泉主墙</span><a href="全景/index.html#P04">环顾此处</a></figcaption></figure><figure><a href="效果预览/S02_主厅主墙.jpg?v=r10-20261012"><img src="效果预览/S02_主厅主墙.jpg?v=r10-20261012" width="1600" height="1100" loading="lazy" alt="重点香器与连续雕刻墙"></a><figcaption><span>重点香器与连续雕刻墙</span><a href="全景/index.html#P04">环顾此处</a></figcaption></figure><figure><a href="效果预览/S03_主厅回望.jpg?v=r10-20261012"><img src="效果预览/S03_主厅回望.jpg?v=r10-20261012" width="1600" height="1100" loading="lazy" alt="回望入口与两侧陈列"></a><figcaption><span>回望入口与两侧陈列</span><a href="全景/index.html#P05">环顾此处</a></figcaption></figure><figure><a href="效果预览/S04_主厅墙顶.jpg?v=r10-20261012"><img src="效果预览/S04_主厅墙顶.jpg?v=r10-20261012" width="1600" height="1100" loading="lazy" alt="曲面藻井与悬挂香灯"></a><figcaption><span>曲面藻井与悬挂香灯</span><a href="全景/index.html#P04">环顾此处</a></figcaption></figure></div><details><summary>查看主厅修改前后对照</summary><div class="compare"><figure><a href="对照/主厅_修改前.jpg?v=r10-20261012"><img src="对照/主厅_修改前.jpg?v=r10-20261012" loading="lazy" width="1280" height="880" alt="主厅原版同机位效果"></a><figcaption>修改前 · r08</figcaption></figure><figure><a href="效果预览/S01_主厅入口.jpg?v=r10-20261012"><img src="效果预览/S01_主厅入口.jpg?v=r10-20261012" loading="lazy" width="1600" height="1100" alt="主厅新样板同机位效果"></a><figcaption>本次样板 · r10</figcaption></figure></div></details></section>
<section id="cafe"><h2>咖啡与庭院 · 庭院茶叙</h2><p class="sample-intro">舒展顶面、圆角吧台与枣红软包形成温暖的休息区，枝影墙面和廊下种植连接室内与庭院。</p><div class="actions"><a class="action primary" href="全景/index.html#P09">进入咖啡全景</a><a class="action" href="全景/index.html#P10">进入庭院全景</a></div><div class="gallery"><figure><a href="效果预览/S05_咖啡入口.jpg?v=r10-20261012"><img src="效果预览/S05_咖啡入口.jpg?v=r10-20261012" width="1600" height="1100" loading="lazy" alt="圆角吧台与软包座席"></a><figcaption><span>圆角吧台与软包座席</span><a href="全景/index.html#P09">环顾此处</a></figcaption></figure><figure><a href="效果预览/S06_咖啡借景.jpg?v=r10-20261012"><img src="效果预览/S06_咖啡借景.jpg?v=r10-20261012" width="1600" height="1100" loading="lazy" alt="从临窗座席望向庭院"></a><figcaption><span>从临窗座席望向庭院</span><a href="全景/index.html#P11">环顾此处</a></figcaption></figure><figure><a href="效果预览/S07_咖啡西壁.jpg?v=r10-20261012"><img src="效果预览/S07_咖啡西壁.jpg?v=r10-20261012" width="1600" height="1100" loading="lazy" alt="枝影墙面与休息座席"></a><figcaption><span>枝影墙面与休息座席</span><a href="全景/index.html#P09">环顾此处</a></figcaption></figure><figure><a href="效果预览/S08_庭院与咖啡.jpg?v=r10-20261012"><img src="效果预览/S08_庭院与咖啡.jpg?v=r10-20261012" width="1600" height="1100" loading="lazy" alt="廊下与咖啡的连接"></a><figcaption><span>廊下与咖啡的连接</span><a href="全景/index.html#P10">环顾此处</a></figcaption></figure><figure><a href="效果预览/S09_庭院回望.jpg?v=r10-20261012"><img src="效果预览/S09_庭院回望.jpg?v=r10-20261012" width="1600" height="1100" loading="lazy" alt="庭院框景、木廊与种植"></a><figcaption><span>庭院框景、木廊与种植</span><a href="全景/index.html#P10">环顾此处</a></figcaption></figure></div><details><summary>查看咖啡修改前后对照</summary><div class="compare"><figure><a href="对照/咖啡_修改前.jpg?v=r10-20261012"><img src="对照/咖啡_修改前.jpg?v=r10-20261012" loading="lazy" width="1280" height="880" alt="咖啡原版同机位效果"></a><figcaption>修改前 · r08</figcaption></figure><figure><a href="效果预览/S05_咖啡入口.jpg?v=r10-20261012"><img src="效果预览/S05_咖啡入口.jpg?v=r10-20261012" loading="lazy" width="1600" height="1100" alt="咖啡新样板同机位效果"></a><figcaption>本次样板 · r10</figcaption></figure></div></details></section
