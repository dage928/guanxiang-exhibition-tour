<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183e36"><title>莞香展馆 · 全景参观</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body>
<main id="stage" tabindex="0" aria-label="展馆全景，拖动或用方向键环顾，滚轮或加减键缩放" aria-busy="true"><div id="hotspots"></div></main>
<header><div class="identity"><h1>莞香展馆</h1><span>全景参观</span></div><div class="tools"><button id="quality" class="textButton">8K 高清</button><button id="helpButton" aria-label="操作说明" aria-expanded="false" aria-controls="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 0 1 6 0c0 2-3 2-3 5m0 3v.2"/></svg></button><button id="fullscreen" aria-label="进入全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button></div></header>
<aside id="help" hidden><strong>像在馆内一样环顾</strong><p>拖动屏幕转动视角，滚轮或双指缩放。点击场景中的箭头，或下方展区，切换位置。</p><p>键盘：方向键环顾，＋／－缩放，Home 回到初始视角。Tab 选择按钮。</p><p>本页面呈现展馆设计的三维渲染全景。</p></aside>
<div id="loading" role="status"><span class="loadingMark"></span><span id="loadingText">正在进入序厅</span></div>
<div id="error" hidden role="alert"><h2>暂时无法显示全景</h2><p id="errorText"></p><button id="retry">重新加载</button></div>
<div id="hint">拖动环顾四周<span>点击箭头切换位置</span></div>
<div class="viewTools"><button id="zoomIn" aria-label="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button id="zoomOut" aria-label="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button id="reset" aria-label="恢复初始视角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button><button id="rotate" aria-label="自动环顾" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9c2-5 14-5 16 0m0 0-4-1m4 1-1-4M20 15c-2 5-14 5-16 0m0 0 4 1m-4-1 1 4"/></svg></button></div>
<footer><div class="locationRow"><div class="location"><span id="chapter">欢迎入馆</span><h2 id="place">序厅与导览</h2></div><div class="routeControls"><span id="counter">1 / 8</span><button id="previous" aria-label="上一站"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button id="next"><span id="nextLabel">下一站</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button><button id="togglePoints" aria-expanded="true" aria-controls="points">展区<span class="chevron"></span></button></div></div><nav id="points" aria-label="选择参观点位"></nav></footer>
<div id="status" class="srOnly" role="status" aria-live="polite"></div><noscript><div class="noScript">请启用 JavaScript 以浏览全景。</div></noscript>
<script src="points.js"></script><script src="viewer.js"></script></body></html>
