<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ac743a"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1100" fill="#f7f4eb" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="70" y="68" font-size="20" fill="#8b714b" text-anchor="start" font-weight="normal">莞香展馆 / 层院·时间剖面</text><text x="70" y="130" font-size="42" fill="#294843" text-anchor="start" font-weight="600">A03  区位方向与概念场地</text><text x="70" y="181" font-size="22" fill="#294843" text-anchor="start" font-weight="normal">东莞 · 莞城为选址方向；以课程设计假设推敲建筑、到达与模型底板的关系。</text><rect x="70" y="235" width="285" height="85" fill="#e0e5d9" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="88" y="268" font-size="25" fill="#294843" text-anchor="start" font-weight="600">东莞</text><text x="88" y="300" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">地域文化语境</text><rect x="380" y="235" width="285" height="85" fill="#e0e5d9" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="398" y="268" font-size="25" fill="#294843" text-anchor="start" font-weight="600">莞城</text><text x="398" y="300" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">既定选址方向</text><rect x="690" y="235" width="285" height="85" fill="#e0e5d9" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="708" y="268" font-size="25" fill="#294843" text-anchor="start" font-weight="600">概念场地</text><text x="708" y="300" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">具体地块尚未确定</text><rect x="90" y="407" width="780" height="468" fill="#efede4" stroke="#829588" stroke-width="1.5" stroke-dasharray="6,5"/><rect x="90" y="355" width="780" height="52" fill="#efede4" stroke="#829588" stroke-width="1.5" stroke-dasharray="6,5"/><rect x="91" y="405" width="778" height="4" fill="#efede4" stroke="none" stroke-width="1" stroke-dasharray=""/><rect x="220" y="426.5" width="520" height="377" fill="#d1dccf" stroke="#496157" stroke-width="1.5" stroke-dasharray=""/><rect x="376" y="556.5" width="208" height="130" fill="#f7f4eb" stroke="#91a192" stroke-width="1.5" stroke-dasharray=""/><text x="480" y="621.5" font-size="22" fill="#294843" text-anchor="middle" font-weight="normal">16 × 10 m 庭院</text><text x="480" y="472" font-size="24" fill="#294843" text-anchor="middle" font-weight="600">40 × 29 m 建筑包络</text><path d="M415,867 L415,815.5" stroke="#ac743a" stroke-width="3" marker-end="url(#arrow)"/><text x="415" y="905" font-size="20" fill="#294843" text-anchor="middle" font-weight="normal">主入口</text><path d="M610,867 L610,815.5" stroke="#ac743a" stroke-width="3" marker-end="url(#arrow)"/><text x="610" y="905" font-size="20" fill="#294843" text-anchor="middle" font-weight="normal">工坊入口</text><text x="155" y="641" font-size="19" fill="#294843" text-anchor="middle" font-weight="normal">侧向</text><text x="155" y="667" font-size="19" fill="#294843" text-anchor="middle" font-weight="normal">留白</text><text x="805" y="641" font-size="19" fill="#294843" text-anchor="middle" font-weight="normal">后勤</text><text x="805" y="667" font-size="19" fill="#294843" text-anchor="middle" font-weight="normal">联系</text><text x="480" y="394" font-size="20" fill="#294843" text-anchor="middle" font-weight="normal">场地北侧留白（假设）</text><text x="1030" y="370" font-size="30" fill="#294843" text-anchor="start" font-weight="600">概念控制</text><text x="1030" y="430" font-size="24" fill="#294843" text-anchor="start" font-weight="600">60 × 40 m</text><text x="1030" y="463" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">场地表达范围，非已落实用地</text><text x="1030" y="525" font-size="24" fill="#294843" text-anchor="start" font-weight="600">60 × 40 cm</text><text x="1030" y="558" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">对应1:100模型底板意向</text><text x="1030" y="620" font-size="24" fill="#294843" text-anchor="start" font-weight="600">周边预留空间</text><text x="1030" y="653" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">建筑居中放置，供入口推敲</text><text x="1030" y="715" font-size="24" fill="#294843" text-anchor="start" font-weight="600">图上北向为假设</text><text x="1030" y="748" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">不据此作真实日照或风向结论</text><text x="1030" y="810" font-size="24" fill="#294843" text-anchor="start" font-weight="600">未绘真实道路与邻栋</text><text x="1030" y="843" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">待具体地块确定后补齐</text><text x="90" y="958" font-size="22" fill="#294843" text-anchor="start" font-weight="normal">外部布置为概念假设；建筑与庭院按图示尺寸表达，不作为红线、退界或消防依据。</text><text x="70" y="1018" font-size="18" fill="#6a7269" text-anchor="start" font-weight="normal">区位表达文化语境与场地尺度关系，不是地理地图或测绘总平面。</text></g></svg>