<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ac743a"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1100" fill="#f7f4eb" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="70" y="68" font-size="20" fill="#8b714b" text-anchor="start" font-weight="normal">莞香展馆 / 层院·时间剖面</text><text x="70" y="130" font-size="42" fill="#294843" text-anchor="start" font-weight="600">A01  文化线索转译</text><text x="70" y="181" font-size="22" fill="#294843" text-anchor="start" font-weight="normal">从材料、地方生活与手艺出发，把文化线索转成空间组织和观看方式。</text><text x="80" y="275" font-size="27" fill="#294843" text-anchor="start" font-weight="600">文化线索</text><text x="570" y="275" font-size="27" fill="#294843" text-anchor="start" font-weight="600">空间表达</text><text x="1080" y="275" font-size="27" fill="#294843" text-anchor="start" font-weight="600">展陈对应</text><rect x="80" y="330" width="420" height="108" fill="#e0e5d9" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="98" y="368" font-size="25" fill="#294843" text-anchor="start" font-weight="600">材料的层次与差异</text><text x="98" y="408" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">木质、含树脂部位、加工痕迹</text><rect x="570" y="330" width="420" height="108" fill="#e7dfcc" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="588" y="368" font-size="25" fill="#294843" text-anchor="start" font-weight="600">层次、开口与显露</text><text x="588" y="408" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">围合展厅与抬高核心空间</text><rect x="1080" y="330" width="430" height="108" fill="#d7e2df" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="1098" y="368" font-size="25" fill="#294843" text-anchor="start" font-weight="600">识香｜EX07–12</text><text x="1098" y="408" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">植物、香材对照＋知识影像</text><path d="M508,384 L550,384" stroke="#ac743a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000,384 L1042,384" stroke="#ac743a" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="473" width="420" height="108" fill="#e0e5d9" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="98" y="511" font-size="25" fill="#294843" text-anchor="start" font-weight="600">地方交往与记忆</text><text x="98" y="551" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">香市人物与资料线索</text><rect x="570" y="473" width="420" height="108" fill="#e7dfcc" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="588" y="511" font-size="25" fill="#294843" text-anchor="start" font-weight="600">环院叙事与停留节点</text><text x="588" y="551" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">在寻香区建立地方语境</text><rect x="1080" y="473" width="430" height="108" fill="#d7e2df" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="1098" y="511" font-size="25" fill="#294843" text-anchor="start" font-weight="600">寻香｜EX01–06</text><text x="1098" y="551" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">莞香历史、香市与地方资料</text><path d="M508,527 L550,527" stroke="#ac743a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000,527 L1042,527" stroke="#ac743a" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="616" width="420" height="108" fill="#e0e5d9" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="98" y="654" font-size="25" fill="#294843" text-anchor="start" font-weight="600">经验的观察与传递</text><text x="98" y="694" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">判断、示范、记录、提问</text><rect x="570" y="616" width="420" height="108" fill="#e7dfcc" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="588" y="654" font-size="25" fill="#294843" text-anchor="start" font-weight="600">开放工坊与可更新展示</text><text x="588" y="694" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">工序展示与传承记录</text><rect x="1080" y="616" width="430" height="108" fill="#d7e2df" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="1098" y="654" font-size="25" fill="#294843" text-anchor="start" font-weight="600">传香｜EX19–24</text><text x="1098" y="694" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">站立观看示范、工序与交流</text><path d="M508,670 L550,670" stroke="#ac743a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000,670 L1042,670" stroke="#ac743a" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="759" width="420" height="108" fill="#e0e5d9" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="98" y="797" font-size="25" fill="#294843" text-anchor="start" font-weight="600">个人感受与选择</text><text x="98" y="837" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">观察、闻香、停留或绕行</text><rect x="570" y="759" width="420" height="108" fill="#e7dfcc" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="588" y="797" font-size="25" fill="#294843" text-anchor="start" font-weight="600">庭院界面与局部体验</text><text x="588" y="837" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">品香区联系院廊休憩</text><rect x="1080" y="759" width="430" height="108" fill="#d7e2df" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="1098" y="797" font-size="25" fill="#294843" text-anchor="start" font-weight="600">品香｜EX13–18</text><text x="1098" y="837" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">自主闻香与感受表达</text><path d="M508,813 L550,813" stroke="#ac743a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000,813 L1042,813" stroke="#ac743a" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="946" font-size="24" fill="#294843" text-anchor="start" font-weight="normal">“层院”是当代设计隐喻：不把建筑当作树干复原，也不把抽象纹理当作实测数据。</text><text x="70" y="1018" font-size="18" fill="#6a7269" text-anchor="start" font-weight="normal">展陈围绕莞香知识展开，实物样本与展示条件须另行落实。</text></g></svg>