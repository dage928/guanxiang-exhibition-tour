<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ac743a"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1100" fill="#f7f4eb" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="70" y="68" font-size="20" fill="#8b714b" text-anchor="start" font-weight="normal">莞香展馆 / 层院·时间剖面</text><text x="70" y="130" font-size="42" fill="#294843" text-anchor="start" font-weight="600">A05  面积构成</text><text x="70" y="181" font-size="22" fill="#294843" text-anchor="start" font-weight="normal">各功能分区以同一控制口径比较，庭院单列，避免与有顶部分重复计算。</text><text x="70" y="311" font-size="23" fill="#294843" text-anchor="start" font-weight="normal">序厅</text><rect x="255" y="285" width="236.25" height="36" fill="#e9dfc9" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="920" y="312" font-size="24" fill="#294843" text-anchor="end" font-weight="normal">70 m²</text><text x="995" y="312" font-size="22" fill="#294843" text-anchor="end" font-weight="normal">7%</text><text x="70" y="376" font-size="23" fill="#294843" text-anchor="start" font-weight="normal">寻香</text><rect x="255" y="350" width="337.5" height="36" fill="#ead9bb" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="920" y="377" font-size="24" fill="#294843" text-anchor="end" font-weight="normal">100 m²</text><text x="995" y="377" font-size="22" fill="#294843" text-anchor="end" font-weight="normal">10%</text><text x="70" y="441" font-size="23" fill="#294843" text-anchor="start" font-weight="normal">识香·样本</text><rect x="255" y="415" width="405.0" height="36" fill="#c8d6ce" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="920" y="442" font-size="24" fill="#294843" text-anchor="end" font-weight="normal">120 m²</text><text x="995" y="442" font-size="22" fill="#294843" text-anchor="end" font-weight="normal">12%</text><text x="70" y="506" font-size="23" fill="#294843" text-anchor="start" font-weight="normal">识香·核心</text><rect x="255" y="480" width="540.0" height="36" fill="#c8d6ce" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="920" y="507" font-size="24" fill="#294843" text-anchor="end" font-weight="normal">160 m²</text><text x="995" y="507" font-size="22" fill="#294843" text-anchor="end" font-weight="normal">16%</text><text x="70" y="571" font-size="23" fill="#294843" text-anchor="start" font-weight="normal">品香</text><rect x="255" y="545" width="472.5" height="36" fill="#c6dce0" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="920" y="572" font-size="24" fill="#294843" text-anchor="end" font-weight="normal">140 m²</text><text x="995" y="572" font-size="22" fill="#294843" text-anchor="end" font-weight="normal">14%</text><text x="70" y="636" font-size="23" fill="#294843" text-anchor="start" font-weight="normal">传香·工坊</text><rect x="255" y="610" width="472.5" height="36" fill="#dbcbb8" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="920" y="637" font-size="24" fill="#294843" text-anchor="end" font-weight="normal">140 m²</text><text x="995" y="637" font-size="22" fill="#294843" text-anchor="end" font-weight="normal">14%</text><text x="70" y="701" font-size="23" fill="#294843" text-anchor="start" font-weight="normal">公共服务</text><rect x="255" y="675" width="236.25" height="36" fill="#dedede" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="920" y="702" font-size="24" fill="#294843" text-anchor="end" font-weight="normal">70 m²</text><text x="995" y="702" font-size="22" fill="#294843" text-anchor="end" font-weight="normal">7%</text><text x="70" y="766" font-size="23" fill="#294843" text-anchor="start" font-weight="normal">后勤管理</text><rect x="255" y="740" width="270.0" height="36" fill="#dedede" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="920" y="767" font-size="24" fill="#294843" text-anchor="end" font-weight="normal">80 m²</text><text x="995" y="767" font-size="22" fill="#294843" text-anchor="end" font-weight="normal">8%</text><text x="70" y="831" font-size="23" fill="#294843" text-anchor="start" font-weight="normal">环廊</text><rect x="255" y="805" width="405.0" height="36" fill="#bfcbb3" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="920" y="832" font-size="24" fill="#294843" text-anchor="end" font-weight="normal">120 m²</text><text x="995" y="832" font-size="22" fill="#294843" text-anchor="end" font-weight="normal">12%</text><text x="1110" y="307" font-size="51" fill="#294843" text-anchor="start" font-weight="600">1000 m²</text><text x="1110" y="346" font-size="23" fill="#294843" text-anchor="start" font-weight="normal">有顶部分面积控制</text><text x="1110" y="440" font-size="40" fill="#294843" text-anchor="start" font-weight="600">160 m²</text><text x="1110" y="477" font-size="22" fill="#294843" text-anchor="start" font-weight="normal">露天庭院 · 单独列示</text><text x="1110" y="576" font-size="40" fill="#294843" text-anchor="start" font-weight="600">1160 m²</text><text x="1110" y="613" font-size="22" fill="#294843" text-anchor="start" font-weight="normal">40 × 29 m 外包轮廓</text><text x="1110" y="715" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">占比以1000 m²为分母</text><text x="1110" y="749" font-size="19" fill="#294843" text-anchor="start" font-weight="normal">并非净使用面积或报建面积</text><text x="70" y="951" font-size="26" fill="#294843" text-anchor="start" font-weight="normal">分区 880 m² + 环廊 120 m² = 有顶部分 1000 m²</text><text x="70" y="1018" font-size="18" fill="#6a7269" text-anchor="start" font-weight="normal">面积控制未按施工构造、建筑面积计算规则或具体场地审批条件核定。</text></g></svg>