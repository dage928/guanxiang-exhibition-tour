rmal">站立看手艺，EX20为辅助内容</text><text x="1030" y="850" font-size="23" fill="#294843" text-anchor="start" font-weight="600">服务支持 · EX17 / EX18</text><text x="1030" y="885" font-size="18" fill="#68776b" text-anchor="start" font-weight="normal">休息点 / 导引牌，分别定位</text><text x="70" y="1018" font-size="18" fill="#6a7269" text-anchor="start" font-weight="normal">不设置食用、品饮或观众自行持刀操作；工坊未增加坐席课程。每点仅标主要体验。</text></g></svg>