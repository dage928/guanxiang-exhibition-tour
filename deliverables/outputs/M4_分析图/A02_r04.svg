roke-dasharray=""/><text x="604" y="291" font-size="27" fill="#294843" text-anchor="start" font-weight="600">B  香巷·双院叙事</text><text x="604" y="331" font-size="19" fill="#8b714b" text-anchor="start" font-weight="normal">历史概念对照</text><rect x="614" y="350" width="400" height="290" fill="#d8d7c8" stroke="#7a8c7e" stroke-width="2" stroke-dasharray=""/><rect x="694" y="460" width="80" height="100" fill="#f7f4eb" stroke="#94a287" stroke-width="1" stroke-dasharray=""/><rect x="854" y="430" width="80" height="100" fill="#f7f4eb" stroke="#94a287" stroke-width="1" stroke-dasharray=""/><polyline points="814,640 814,590 654,590 654,400 814,400 964,390 974,580 844,580 844,640" stroke="#ac743a" stroke-width="3" fill="none"/><text x="604" y="680" font-size="23" fill="#294843" text-anchor="start" font-weight="600">地方交往 → 双院香巷</text><text x="604" y="732" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">转折路径形成不同停留节点</text><text x="604" y="784" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">接口与流线协调更复杂</text><text x="604" y="836" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">作为方案比较保留</text><rect x="1090" y="240" width="470" height="675" fill="#efede4" stroke="#d5d8cc" stroke-width="2" stroke-dasharray=""/><text x="1114" y="291" font-size="27" fill="#294843" text-anchor="start" font-weight="600">C  共作·开放工坊</text><text x="1114" y="331" font-size="19" fill="#8b714b" text-anchor="start" font-weight="normal">历史概念对照</text><rect x="1124" y="350" width="400" height="290" fill="#d8d7c8" stroke="#7a8c7e" stroke-width="2" stroke-dasharray=""/><rect x="1224" y="455.0" width="200" height="80" fill="#f7f4eb" stroke="#94a287" stroke-width="1" stroke-dasharray=""/><polyline points="1264,640 1264,600 1174,600 1174,410 1324,400 1474,410 1474,580 1364,590 1364,640" stroke="#ac743a" stroke-width="3" fill="none"/><text x="1114" y="680" font-size="23" fill="#294843" text-anchor="start" font-weight="600">技艺学习 → 开放工坊</text><text x="1114" y=