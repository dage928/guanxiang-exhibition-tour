<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ac743a"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1100" fill="#f7f4eb" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="70" y="68" font-size="20" fill="#8b714b" text-anchor="start" font-weight="normal">莞香展馆 / 层院·时间剖面</text><text x="70" y="130" font-size="42" fill="#294843" text-anchor="start" font-weight="600">A09  材料与色彩层次</text><text x="70" y="181" font-size="22" fill="#294843" text-anchor="start" font-weight="normal">暖灰、木色与灰绿构成视觉基调；地坪材料与分格见D04。</text><rect x="70" y="255" width="345" height="120" fill="#d3cbbd" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="86" y="415" font-size="23" fill="#294843" text-anchor="start" font-weight="600">F01 / F02</text><text x="86" y="452" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">展厅 / 院廊</text><text x="86" y="488" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">石感砖；1200×600模数</text><rect x="445" y="255" width="345" height="120" fill="#bdbbb0" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="461" y="415" font-size="23" fill="#294843" text-anchor="start" font-weight="600">F03</text><text x="461" y="452" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">公共服务 / 后勤</text><text x="461" y="488" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">易清洁哑光砖；600×600</text><rect x="820" y="255" width="345" height="120" fill="#a7afa0" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="836" y="415" font-size="23" fill="#294843" text-anchor="start" font-weight="600">F04 / F05</text><text x="836" y="452" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">庭院 / 齐平收边</text><text x="836" y="488" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">户外石材；坡面与收边</text><rect x="1195" y="255" width="345" height="120" fill="#d7ccb5" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="1211" y="415" font-size="23" fill="#294843" text-anchor="start" font-weight="600">墙面</text><text x="1211" y="452" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">室内外背景</text><text x="1211" y="488" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">暖灰米色矿物质感</text><rect x="70" y="533" width="345" height="120" fill="#ad8553" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="86" y="693" font-size="23" fill="#294843" text-anchor="start" font-weight="600">暖木饰面</text><text x="86" y="730" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">展具、入口与格栅</text><text x="86" y="766" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">材料触感与局部强调</text><rect x="445" y="533" width="345" height="120" fill="#405249" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="461" y="693" font-size="23" fill="#294843" text-anchor="start" font-weight="600">金属 / 玻璃</text><text x="461" y="730" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">细框、五金与透明界面</text><text x="461" y="766" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">深灰绿金属 / 低色偏玻璃</text><rect x="820" y="533" width="345" height="120" fill="#778b78" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="836" y="693" font-size="23" fill="#294843" text-anchor="start" font-weight="600">屋面</text><text x="836" y="730" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">建筑覆盖与檐口</text><text x="836" y="766" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">灰绿方向，规格待深化</text><rect x="1195" y="533" width="345" height="120" fill="#153538" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="1211" y="693" font-size="23" fill="#294843" text-anchor="start" font-weight="600">整墙影像</text><text x="1211" y="730" font-size="20" fill="#294843" text-anchor="start" font-weight="normal">EX09知识影像</text><text x="1211" y="766" font-size="18" fill="#294843" text-anchor="start" font-weight="normal">深青绿与暖金，缓慢图解</text><rect x="70" y="843" width="1470" height="120" fill="#e7e5d9" stroke="none" stroke-width="1" stroke-dasharray=""/><text x="92" y="886" font-size="24" fill="#294843" text-anchor="start" font-weight="600">地坪模数与接缝见D04；色块表达材料意向，实物样板另行核定。</text><text x="92" y="930" font-size="21" fill="#294843" text-anchor="start" font-weight="normal">材料规格与性能须实物核定；整墙播放“从树到香”知识影像。</text><text x="70" y="1018" font-size="18" fill="#6a7269" text-anchor="start" font-weight="normal">地坪分格与收边见D04；色彩意向不能替代实物选样。</text></g></svg>