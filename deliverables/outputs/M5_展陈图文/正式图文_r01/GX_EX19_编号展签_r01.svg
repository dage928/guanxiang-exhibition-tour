<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">19  /  传香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香手艺示范</text><text x="18" y="67" font-size="7" fill="#1e4744">近看材料判断如何转化为手艺动作。</text><text x="18" y="86" font-size="8" fill="#415c53">示范围绕一块材料展开：辨看木纹与保留部位，再讲解工具选择和理香</text><text x="18" y="100" font-size="8" fill="#415c53">处理。观众站在观看区，从材料前后的差别理解手艺；工具操作由示范</text><text x="18" y="114" font-size="8" fill="#415c53">人员完成。</text></g></svg>