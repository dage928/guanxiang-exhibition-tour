<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">14  /  品香</text><text x="17" y="48" font-size="11" fill="#1e4744">香材与香品</text><text x="18" y="67" font-size="7" fill="#1e4744">认识原料形态和加工后产品的区别。</text><text x="18" y="86" font-size="8" fill="#415c53">保留形态的香材、加工成的香粉，以及线香、塔香等香品，呈现材料的</text><text x="18" y="100" font-size="8" fill="#415c53">不同使用形式。外形相似的产品也可能有不同配料，认识具体香品时，</text><text x="18" y="114" font-size="8" fill="#415c53">应把形态和实际成分记录联系起来。</text></g></svg>