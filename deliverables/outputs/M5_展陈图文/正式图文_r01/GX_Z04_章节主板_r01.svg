<svg xmlns="http://www.w3.org/2000/svg" width="600mm" height="1000mm" viewBox="0 0 600 1000"><rect width="600" height="1000" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="46" y="62" width="75" height="5" fill="#aa8150"/><text x="46" y="140" font-size="22" fill="#977347">莞香 · 04</text><text x="40" y="305" font-size="110" fill="#1e4744">传香</text><text x="46" y="405" font-size="29" fill="#1e4744">莞香技艺的延续</text><text x="46" y="505" font-size="24" fill="#1e4744">手艺从人与材料的相处中延续。看一段理</text><text x="46" y="539" font-size="24" fill="#1e4744">香示范，认识真实的传承人，留下关于莞</text><text x="46" y="573" font-size="24" fill="#1e4744">香的观察；再从培育、保护与学习中，理</text><text x="46" y="607" font-size="24" fill="#1e4744">解下一棵树与下一代人的关系。</text><text x="46" y="902" font-size="17" fill="#68766a">寻香  /  识香  /  品香  /  传香</text></g></svg>