<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#ad8046" stroke-width="1.3" /></marker></defs><rect width="1800" height="1200" fill="#f4f0e5" /><g font-family="Microsoft YaHei, sans-serif"><text x="90" y="90" font-size="23" fill="#9a713e">品香 / EX13 · EX16</text><text x="90" y="170" font-size="58" fill="#1e4744">闻一份，记下自己的感受</text><text x="90" y="230" font-size="25" fill="#64716b">样本编号把眼前的材料、这一次闻香与记录连在一起。</text><rect x="90" y="310" width="500" height="620" rx="8" fill="#e1e7de" /><rect x="650" y="310" width="500" height="620" rx="8" fill="#e1e7de" /><rect x="1210" y="310" width="500" height="620" rx="8" fill="#e1e7de" /><text x="125" y="376" font-size="35" fill="#1e4744">01 / 选一份</text><text x="685" y="376" font-size="35" fill="#1e4744">02 / 轻闻</text><text x="1245" y="376" font-size="35" fill="#1e4744">03 / 放回</text><rect x="235" y="502" width="190" height="160" rx="8" fill="#d2ddd6" /><path d="M235 502H425V662H235Z" fill="none" stroke="#57766a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M252 507V538" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M277 507V538" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M302 507V538" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M327 507V538" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M352 507V538" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M377 507V538" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M402 507V538" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round