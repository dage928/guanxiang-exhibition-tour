ze="22" fill="#1e4744">01</text><text x="724" y="718" font-size="25" fill="#1e4744">保留通气盖，逐份体验。</text><rect x="1355" y="529" width="190" height="160" rx="8" fill="#d2ddd6" /><path d="M1355 529H1545V689H1355Z" fill="none" stroke="#57766a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1372 534V565" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1397 534V565" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1422 534V565" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1447 534V565" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1472 534V565" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1497 534V565" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1522 534V565" fill="none" stroke="#65756b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1400 646L1421 603L1492 628L1470 658Z" fill="#a07c49" stroke="#a07c49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1424" y="666" width="52" height="35" rx="8" fill="#eee5d2" /><text x="1433" y="692" font-size="22" fill="#1e4744">01</text><path d="M1335 693H1565V741H1335Z" fill="none" stroke="#a48d62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="1435" y="729" font-size="23" fill="#1e4744">01</text><path d="M1581 520V672" fill="none" stroke="#ad8046" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M1569 656L1581 672L1593 656" fill="none" stroke="#ad8046" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="125" y="808" font-size="28" fill="#1e4744">一次只取一盒。</text><text x="125" y="863" font-size="25" fill="#1e4744">先看对应编号与材料说明。</text><text x="685" y="808" font-size="27" fill="#1e4744">留意这一份材料的气味。</text><text x="685" y="863" font-size="25" fill="#1e4744">感受不需要相同答案。</text><text x="1245" y="808" font-size="28" fill="#1e4744">对照编号归位。</text><text x="1245" y="863" font-size="25" fill="#1e4744">01 / 02 / 03各回对应托座。</text><text x="90" y="988" font-size="26" fill="#1e4744">记录：样本编号 / 我的词语 / 日期；“很淡”或“没有明显气味”也可以如实写下。</text></g></svg>