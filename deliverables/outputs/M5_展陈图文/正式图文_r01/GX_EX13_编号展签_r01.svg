<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">13  /  品香</text><text x="17" y="48" font-size="11" fill="#1e4744">闻莞香</text><text x="18" y="67" font-size="7" fill="#1e4744">把嗅觉感受与眼前的具体材料联系起来。</text><text x="18" y="86" font-size="8" fill="#415c53">这一站将莞香材料与气味体验相连。每次只观察和闻一个有来源记录的</text><text x="18" y="100" font-size="8" fill="#415c53">样本，留意它的形态与气味。没有闻到明显气味也可以如实记录；感受</text><text x="18" y="114" font-size="8" fill="#415c53">不需要相同答案。</text></g></svg>