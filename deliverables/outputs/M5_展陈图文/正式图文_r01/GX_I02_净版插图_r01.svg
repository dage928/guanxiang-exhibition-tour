<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#ad8046" stroke-width="1.3" /></marker></defs><rect width="1800" height="1200" fill="#f4f0e5" /><g font-family="Microsoft YaHei, sans-serif"><text x="90" y="90" font-size="23" fill="#9a713e">寻香 / EX02</text><text x="90" y="170" font-size="58" fill="#1e4744">莞香的产地与流通</text><text x="90" y="230" font-size="25" fill="#64716b">种植地点与交易地点承担不同角色，共同连接东莞的莞香故事。</text><rect x="90" y="300" width="1620" height="665" rx="8" fill="#e3e8df" /><text x="130" y="357" font-size="26" fill="#1e4744">东莞文化节点 / 联系示意</text><path d="M500 500C740 500 810 600 1050 600M500 775C740 775 810 600 1050 600" fill="none" stroke="#b18d58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="385" cy="500" r="104" fill="#698778" /><circle cx="385" cy="775" r="104" fill="#698778" /><circle cx="1225" cy="628" r="174" fill="#20534c" /><text x="335" y="514" font-size="45" fill="#f6f1e7">茶山</text><text x="311" y="790" font-size="45" fill="#f6f1e7">大岭山</text><text x="1130" y="615" font-size="44" fill="#f6f1e7">寮步香市</text><text x="1155" y="676" font-size="29" fill="#e0c69a">香货集散</text><text x="550" y="435" font-size="29" fill="#1e4744">地方资料记述的种植地</text><text x="815" y="535" font-size="24" fill="#887244">生产与交易联系</text><text x="1075" y="864" font-size="28" fill="#1e4744">明清时期集聚香货交易</text><text x="550" y="863" font-size="27" fill="#1e4744">种植 · 加工 · 集散</text><text x="90" y="1055" font-size="23" fill="#69746c">节点位置与连线不表示地理方位、距离、行程或唯一古代运输路线。</text></g></svg>