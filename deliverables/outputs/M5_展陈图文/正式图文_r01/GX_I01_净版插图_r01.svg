<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#ad8046" stroke-width="1.3" /></marker></defs><rect width="1800" height="1200" fill="#f4f0e5" /><g font-family="Microsoft YaHei, sans-serif"><text x="90" y="90" font-size="23" fill="#9a713e">寻香 / EX01</text><text x="90" y="170" font-size="58" fill="#1e4744">莞香是什么</text><text x="90" y="230" font-size="25" fill="#64716b">分清树、香材与地方名称，才能理解一块香材的来处。</text><rect x="90" y="300" width="520" height="670" rx="8" fill="#e4e6d8" /><rect x="640" y="300" width="520" height="670" rx="8" fill="#ebe0c9" /><rect x="1190" y="300" width="520" height="670" rx="8" fill="#dce6df" /><text x="125" y="355" font-size="22" fill="#1e4744">01 / 树</text><text x="675" y="355" font-size="22" fill="#1e4744">02 / 材料</text><text x="1225" y="355" font-size="22" fill="#1e4744">03 / 地方名称</text><path d="M350 655V454M350 532L287 484M350 574L423 516M350 491L387 451" fill="none" stroke="#6b6950" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M349 482Q262 489 261 416Q328 417 349 482Z" fill="#688777" stroke="#688777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M350 526Q428 536 448 457Q383 455 350 526Z" fill="#688777" stroke="#688777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M350 586Q252 586 241 511Q311 509 350 586Z" fill="#688777" stroke="#688777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M352 453Q334 383 389 375Q424 435 352 453Z" fill="#688777" stroke="#688777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(770 462)"><path d="M0 15L60 0L222 24L255 152L190 185L26 161Z" fill="#d9b985" stroke="#b09262" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M25 20Q10 92 43 152" fill="none" stroke="#b7996e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M57 20Q49 92 75 152" fill="none" stroke="#b7996e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M89 20Q88 92 107 152" fill="none" stroke="#b7996e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M121 20Q127 92 139 152" fill="none" stroke="#b7996e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M153 20Q166 92 171 152" fill="none" stroke="#b7996e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M121 32Q150 48 146 87Q178 89 186 132L162 153Q141 132 127 108Q105 99 109 75Z" fill="#80592f" stroke="#80592f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="1240" y="425" width="420" height="230" rx="8" fill="#23534d" /><text x="1342" y="520" font-size="66" fill="#f4f0e5">东莞</text><text x="1280" y="594" font-size="27" fill="#e6d1a5">生产 · 交易 · 技艺</text><text x="125" y="733" font-size="43" fill="#1e4744">白木香</text><text x="125" y="790" font-size="27" fill="#1e4744">是一种树，也称土沉香。</text><text x="675" y="733" font-size="43" fill="#1e4744">沉香材料</text><text x="675" y="790" font-size="27" fill="#1e4744">与含树脂的木材相联系。</text><text x="675" y="838" font-size="24" fill="#1e4744">不是每一块白木香木材</text><text x="675" y="875" font-size="24" fill="#1e4744">都已经成为香材。</text><text x="1225" y="733" font-size="43" fill="#1e4744">莞香</text><text x="1225" y="790" font-size="27" fill="#1e4744">把香材与东莞联系起来。</text><text x="1225" y="838" font-size="24" fill="#1e4744">名称承载地方生产、</text><text x="1225" y="875" font-size="24" fill="#1e4744">交易及技艺的文化联系。</text></g></svg>