<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">10  /  识香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香香材的形态</text><text x="18" y="67" font-size="7" fill="#1e4744">观察形状与纹理，不能靠颜色判断身份和等级。</text><text x="18" y="86" font-size="8" fill="#415c53">香材可呈现不同的块形、厚薄与纹理。相近的外观不等于相同的来源，</text><text x="18" y="100" font-size="8" fill="#415c53">深色也不能单独证明品质。眼前的形态比较用来认识差异；样本身份需</text><text x="18" y="114" font-size="8" fill="#415c53">要对应的来源记录。</text></g></svg>