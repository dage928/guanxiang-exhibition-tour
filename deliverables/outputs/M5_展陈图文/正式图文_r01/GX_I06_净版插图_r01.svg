<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#ad8046" stroke-width="1.3" /></marker></defs><rect width="1800" height="1200" fill="#f4f0e5" /><g font-family="Microsoft YaHei, sans-serif"><text x="90" y="90" font-size="23" fill="#9a713e">识香 / EX08 · EX10</text><text x="90" y="170" font-size="58" fill="#1e4744">木质与含树脂区域</text><text x="90" y="230" font-size="25" fill="#64716b">看见局部变化，同时保留对材料来源与真实结构的判断。</text><rect x="90" y="300" width="1000" height="650" rx="8" fill="#e9e0ce" /><g transform="translate(255 410) scale(2.5)"><g transform="translate(0 0)"><path d="M0 15L60 0L222 24L255 152L190 185L26 161Z" fill="#d9b985" stroke="#b09262" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M25 20Q10 92 43 152" fill="none" stroke="#b7996e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M57 20Q49 92 75 152" fill="none" stroke="#b7996e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M89 20Q88 92 107 152" fill="none" stroke="#b7996e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M121 20Q127 92 139 152" fill="none" stroke="#b7996e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M153 20Q166 92 171 152" fill="none" stroke="#b7996e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M121 32Q150 48 146 87Q178 89 186 132L162 153Q141 132 127 108Q105 99 109 75Z" fill="#80592f" stroke="#80592f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><path d="M365 600L170 505H125" fill="none" stroke="#596c61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="125" y="470" font-size="28" fill="#1e4744">木质示意</text><path d="M622 633L993 525H1145" fill="none" stroke="#8c6436" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="1170" y="520" font-size="35" fill="#1e4744">局部含树脂变化区</text><text x="1170" y="584" font-size="26" fill="#1e4744">深色用于区分示意区域，</text><text x="1170" y="630" font-size="26" fill="#1e4744">不代表实测含量。</text><text x="1170" y="740" font-size="31" fill="#1e4744">观察时还要看什么？</text><text x="1170" y="800" font-size="26" fill="#1e4744">木纹、边缘与局部深浅。</text><text x="1170" y="850" font-size="26" fill="#1e4744">样本身份须有来源记录。</text><text x="90" y="1055" font-size="22" fill="#69746c">深色区域不代表固定同心年轮或定量显微结构，也不能仅凭颜色判断品质。</text></g></svg>