<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">01  /  寻香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香是什么</text><text x="18" y="67" font-size="7" fill="#1e4744">分清树、香材与地方名称。</text><text x="18" y="86" font-size="8" fill="#415c53">白木香是树；含有树脂的木材才与沉香材料相联系。莞香则把这种材料</text><text x="18" y="100" font-size="8" fill="#415c53">和东莞的地方生产、交易及技艺联系起来。不是每一块白木香木材都已</text><text x="18" y="114" font-size="8" fill="#415c53">经成为香材。</text></g></svg>