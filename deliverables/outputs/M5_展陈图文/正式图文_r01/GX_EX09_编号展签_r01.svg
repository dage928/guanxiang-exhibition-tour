<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">09  /  识香</text><text x="17" y="48" font-size="11" fill="#1e4744">从树到香</text><text x="18" y="67" font-size="7" fill="#1e4744">从植物、局部变化再到手艺理解莞香。</text><text x="18" y="86" font-size="8" fill="#415c53">先看白木香的叶与果，再进入木材内部的变化，最后回到理香与拣香。</text><text x="18" y="100" font-size="8" fill="#415c53">影像中的剖面是帮助理解的示意；不同香材的经历与形态仍需结合来源</text><text x="18" y="114" font-size="8" fill="#415c53">和实物认识。</text></g></svg>