<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">08  /  识香</text><text x="17" y="48" font-size="11" fill="#1e4744">白木香怎样结香</text><text x="18" y="67" font-size="7" fill="#1e4744">结香涉及植物应对刺激与相关物质积累。</text><text x="18" y="86" font-size="8" fill="#415c53">白木香受到损伤等刺激时，会发生防御与代谢变化；某些微生物也与这</text><text x="18" y="100" font-size="8" fill="#415c53">一过程有关。研究显示不同处理可产生不同结果。结香不是树龄一到便</text><text x="18" y="114" font-size="8" fill="#415c53">自动完成，也没有适用于所有树木的统一倒计时。</text></g></svg>