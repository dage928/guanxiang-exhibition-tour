<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">12  /  识香</text><text x="17" y="48" font-size="11" fill="#1e4744">理香：去木留香</text><text x="18" y="67" font-size="7" fill="#1e4744">理香是一种依材料判断的手艺。</text><text x="18" y="86" font-size="8" fill="#415c53">理香需要辨看材料结构，再选择工具处理不保留的木质部分。铲刀、勾</text><text x="18" y="100" font-size="8" fill="#415c53">丝刀、凿子等工具各有用途，落刀和用力依材料而定。展出的动作关系</text><text x="18" y="114" font-size="8" fill="#415c53">解释判断，并不代替现场师傅的示范。</text></g></svg>