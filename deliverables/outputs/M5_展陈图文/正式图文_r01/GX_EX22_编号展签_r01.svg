<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">22  /  传香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香学习成果</text><text x="18" y="67" font-size="7" fill="#1e4744">学习可以留下具体的观察与表达。</text><text x="18" y="86" font-size="8" fill="#415c53">一张辨认叶、花、果的观察图，一份材料前后的比较记录，都能留下与</text><text x="18" y="100" font-size="8" fill="#415c53">莞香有关的学习成果。这里收集植物、材料与手艺的观察；每件真实作</text><text x="18" y="114" font-size="8" fill="#415c53">品都保留作者与日期。</text></g></svg>