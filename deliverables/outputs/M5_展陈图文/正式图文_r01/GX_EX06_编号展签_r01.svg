<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">06  /  寻香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香与东莞</text><text x="18" y="67" font-size="7" fill="#1e4744">莞香既是地方物产，也是城市记忆的一部分。</text><text x="18" y="86" font-size="8" fill="#415c53">地方种植、寮步香市和制香手艺，把莞香与东莞联系起来。2011年，</text><text x="18" y="100" font-size="8" fill="#415c53">莞香花被用于东莞城市标识；从香材到花形，人们以不同方式表达这份</text><text x="18" y="114" font-size="8" fill="#415c53">地方联系。</text></g></svg>