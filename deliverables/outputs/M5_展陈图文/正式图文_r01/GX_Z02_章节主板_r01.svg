<svg xmlns="http://www.w3.org/2000/svg" width="600mm" height="1000mm" viewBox="0 0 600 1000"><rect width="600" height="1000" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="46" y="62" width="75" height="5" fill="#aa8150"/><text x="46" y="140" font-size="22" fill="#977347">莞香 · 02</text><text x="40" y="305" font-size="110" fill="#1e4744">识香</text><text x="46" y="405" font-size="29" fill="#1e4744">从白木香到香材</text><text x="46" y="505" font-size="24" fill="#1e4744">白木香是一种树，沉香是特定变化形成的</text><text x="46" y="539" font-size="24" fill="#1e4744">含树脂木材。由叶、花、果认识植物，再</text><text x="46" y="573" font-size="24" fill="#1e4744">从木质与树脂的关系走近香材，理解理香</text><text x="46" y="607" font-size="24" fill="#1e4744">与拣香所依靠的判断。</text><text x="46" y="902" font-size="17" fill="#68766a">寻香  /  识香  /  品香  /  传香</text></g></svg>