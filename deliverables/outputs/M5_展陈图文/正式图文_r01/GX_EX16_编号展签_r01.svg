<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">16  /  品香</text><text x="17" y="48" font-size="11" fill="#1e4744">描述莞香的气味</text><text x="18" y="67" font-size="7" fill="#1e4744">闻香记录属于个人观察。</text><text x="18" y="86" font-size="8" fill="#415c53">选择你刚闻过的那个样本，写下一个最先想到的词，也可以记下“很淡”</text><text x="18" y="100" font-size="8" fill="#415c53">或“没有明显气味”。再回看材料编号：你记录的是这一次、这一份材</text><text x="18" y="114" font-size="8" fill="#415c53">料带来的感受，不是给所有莞香下定义。</text></g></svg>