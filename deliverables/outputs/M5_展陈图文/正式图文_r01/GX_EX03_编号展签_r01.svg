<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">03  /  寻香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香的历史</text><text x="18" y="67" font-size="7" fill="#1e4744">地方物产通过交易、传承与当代学习不断延续。</text><text x="18" y="86" font-size="8" fill="#415c53">明清时期的寮步因香货集散而兴盛。今天，莞香仍进入东莞的城市表达，</text><text x="18" y="100" font-size="8" fill="#415c53">也通过非遗保护、技艺示范和学习交流延续。从市场、城市标识到学习</text><text x="18" y="114" font-size="8" fill="#415c53">活动，莞香与地方生活的联系不断展开。</text></g></svg>