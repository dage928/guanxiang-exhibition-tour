<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">04  /  寻香</text><text x="17" y="48" font-size="11" fill="#1e4744">香农与香商</text><text x="18" y="67" font-size="7" fill="#1e4744">香市是多人协作形成的交易网络。</text><text x="18" y="86" font-size="8" fill="#415c53">香农带来生产端的香货，坐商在香市经营，行商往来采购和贩运。寮步</text><text x="18" y="100" font-size="8" fill="#415c53">香市的延续不只靠一位名人，也依靠这些群体及相互往来的交易习俗。</text></g></svg>