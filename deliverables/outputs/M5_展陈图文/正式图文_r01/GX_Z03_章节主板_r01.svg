<svg xmlns="http://www.w3.org/2000/svg" width="600mm" height="1000mm" viewBox="0 0 600 1000"><rect width="600" height="1000" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="46" y="62" width="75" height="5" fill="#aa8150"/><text x="46" y="140" font-size="22" fill="#977347">莞香 · 03</text><text x="40" y="305" font-size="110" fill="#1e4744">品香</text><text x="46" y="405" font-size="29" fill="#1e4744">香材、香品与气味</text><text x="46" y="505" font-size="24" fill="#1e4744">香材可以保留原形，也可以加工成香粉与</text><text x="46" y="539" font-size="24" fill="#1e4744">不同香品。这里把材料、形态和闻香感受</text><text x="46" y="573" font-size="24" fill="#1e4744">相连：留意眼前的具体样本，用自己的词</text><text x="46" y="607" font-size="24" fill="#1e4744">语描述气味。</text><text x="46" y="902" font-size="17" fill="#68766a">寻香  /  识香  /  品香  /  传香</text></g></svg>