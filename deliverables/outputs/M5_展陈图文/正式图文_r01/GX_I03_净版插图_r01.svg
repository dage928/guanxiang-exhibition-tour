<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#ad8046" stroke-width="1.3" /></marker></defs><rect width="1800" height="1200" fill="#f4f0e5" /><g font-family="Microsoft YaHei, sans-serif"><text x="90" y="90" font-size="23" fill="#9a713e">寻香 / EX03</text><text x="90" y="170" font-size="58" fill="#1e4744">莞香与地方生活</text><text x="90" y="230" font-size="25" fill="#64716b">从香货集散，到城市表达、非遗保护与学习交流。</text><path d="M260 340V950" fill="none" stroke="#bb9b66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="260" cy="365" r="11" fill="#b58b50" /><text x="95" y="373" font-size="27" fill="#1e4744">明清时期</text><rect x="315" y="325" width="1395" height="135" rx="8" fill="#e3e8df" /><text x="355" y="370" font-size="34" fill="#1e4744">香货集散</text><text x="600" y="369" font-size="27" fill="#1e4744">寮步因香货集散而兴盛。</text><circle cx="260" cy="525" r="11" fill="#b58b50" /><text x="95" y="533" font-size="27" fill="#1e4744">2011</text><rect x="315" y="485" width="1395" height="135" rx="8" fill="#e3e8df" /><text x="355" y="530" font-size="34" fill="#1e4744">城市表达</text><text x="600" y="529" font-size="27" fill="#1e4744">莞香花用于东莞城市标识。</text><circle cx="260" cy="685" r="11" fill="#b58b50" /><text x="95" y="693" font-size="27" fill="#1e4744">2014</text><rect x="315" y="645" width="1395" height="135" rx="8" fill="#e3e8df" /><text x="355" y="690" font-size="34" fill="#1e4744">非遗保护</text><text x="600" y="689" font-size="27" fill="#1e4744">莞香制作技艺、寮步香市入列第四批</text><text x="600" y="735" font-size="27" fill="#1e4744">国家级非物质文化遗产代表性项目名录。</text><circle cx="260" cy="845" r="11" fill="#b58b50" /><text x="95" y="853" font-size="27" fill="#1e4744">2024.04</text><rect x="315" y="805" width="1395" height="135" rx="8" fill="#e3e8df" /><text x="355" y="850" font-size="34" fill="#1e4744">学习交流</text><text x="600" y="849" font-size="27" fill="#1e4744">东莞职业技术学院师生赴莞香非遗文化园交流。</text><text x="90" y="1055" font-size="22" fill="#69746c">节点间距不代表时间比例。</text></g></svg>