<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">07  /  识香</text><text x="17" y="48" font-size="11" fill="#1e4744">认识白木香</text><text x="18" y="67" font-size="7" fill="#1e4744">通过叶、花、果认识同一种植物。</text><text x="18" y="86" font-size="8" fill="#415c53">白木香也称土沉香，学名Aquilaria sinensis。它</text><text x="18" y="100" font-size="8" fill="#415c53">是常绿乔木，叶互生，花淡黄绿色；木质蒴果成熟后开裂，种子可悬垂</text><text x="18" y="114" font-size="8" fill="#415c53">于果外。叶、花、果分别呈现植物在不同阶段的形态。</text></g></svg>