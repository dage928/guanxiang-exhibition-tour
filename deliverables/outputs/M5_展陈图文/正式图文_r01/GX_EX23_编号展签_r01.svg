<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">23  /  传香</text><text x="17" y="48" font-size="11" fill="#1e4744">下一棵莞香树</text><text x="18" y="67" font-size="7" fill="#1e4744">认识香材，也关心植物的培育与延续。</text><text x="18" y="86" font-size="8" fill="#415c53">白木香的未来涉及培育、研究和保护。香港2023—2027年土沉</text><text x="18" y="100" font-size="8" fill="#415c53">香行动计划包括树木保护、繁育与公众教育；内地研究机构也开展白木</text><text x="18" y="114" font-size="8" fill="#415c53">香良种研发。不同地区的实践，为理解持续利用提供了具体例子。</text></g></svg>