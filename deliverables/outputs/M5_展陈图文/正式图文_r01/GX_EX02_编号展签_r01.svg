<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">02  /  寻香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香的产地与流通</text><text x="18" y="67" font-size="7" fill="#1e4744">生产地点和交易地点承担不同角色。</text><text x="18" y="86" font-size="8" fill="#415c53">东莞的莞香故事既有种植地，也有集散地。地方资料记述茶山、大岭山</text><text x="18" y="100" font-size="8" fill="#415c53">等地的种植；明清时期，寮步香市集聚香货交易。种植、加工、集散由</text><text x="18" y="114" font-size="8" fill="#415c53">不同地点和人共同完成。</text></g></svg>