<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">05  /  寻香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香技艺与寮步香市</text><text x="18" y="67" font-size="7" fill="#1e4744">技艺和民俗保护的是相联系的不同内容。</text><text x="18" y="86" font-size="8" fill="#415c53">莞香制作技艺关注树木、材料处理和制香经验；寮步香市关注香货交易</text><text x="18" y="100" font-size="8" fill="#415c53">形成的习俗与群体生活。两项都在2014年列入国家级非遗名录，分</text><text x="18" y="114" font-size="8" fill="#415c53">别属于传统技艺与民俗。</text></g></svg>