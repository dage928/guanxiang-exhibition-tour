<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#ad8046" stroke-width="1.3" /></marker></defs><rect width="1800" height="1200" fill="#f4f0e5" /><g font-family="Microsoft YaHei, sans-serif"><text x="90" y="90" font-size="23" fill="#9a713e">传香 / EX21 · EX22</text><text x="90" y="170" font-size="58" fill="#1e4744">让技艺进入新的学习</text><text x="90" y="230" font-size="25" fill="#64716b">一份人物档案，一次有日期的交流，以及持续的观察与记录。</text><rect x="90" y="310" width="700" height="485" rx="8" fill="#24564e" /><text x="135" y="365" font-size="24" fill="#d8c18f">人物档案</text><text x="135" y="477" font-size="76" fill="#f5f0e4">黄欧</text><text x="135" y="559" font-size="35" fill="#f5f0e4">莞香制作技艺</text><text x="135" y="625" font-size="30" fill="#f5f0e4">国家级非遗代表性传承人</text><text x="135" y="687" font-size="27" fill="#d8c18f">广东省东莞市</text><rect x="830" y="310" width="880" height="485" rx="8" fill="#e6e3d3" /><text x="875" y="365" font-size="24" fill="#8e7245">学习事件</text><text x="875" y="451" font-size="43" fill="#1e4744">2024年4月12日</text><text x="875" y="524" font-size="32" fill="#1e4744">东莞职业技术学院师生</text><text x="875" y="577" font-size="29" fill="#1e4744">参访鸡翅岭莞香非遗文化园，</text><text x="875" y="626" font-size="29" fill="#1e4744">听汤锦华介绍莞香。</text><rect x="90" y="830" width="1620" height="175" rx="8" fill="#dce5dc" /><path d="M140 936L192 892Q207 883 218 897L195 920L262 892Q279 889 280 904L229 938L191 965Z" fill="#c6ab7e" stroke="#947952" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M430 936L381 892Q365 883 354 897L377 920L311 892Q294 889 293 904L343 938L380 965Z" fill="#c6ab7e" stroke="#947952" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M243 959L278 924L321 946L312 977L269 982Z" fill="#805a35" stroke="#805a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="490" y="889" font-size="34" fill="#1e4744">看材料，问工序，留下观察</text><text x="132" y="994" font-size="18" fill="#69746c">匿名手艺符号</text></g></svg>