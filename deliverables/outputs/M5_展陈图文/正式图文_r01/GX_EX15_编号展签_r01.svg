<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">15  /  品香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香的使用方式</text><text x="18" y="67" font-size="7" fill="#1e4744">形式、器具和观看方式共同构成用香体验。</text><text x="18" y="86" font-size="8" fill="#415c53">莞香可用于熏香，也可加工成香粉，以篆香等形式使用。香材、香粉与</text><text x="18" y="100" font-size="8" fill="#415c53">成型香品需要相应的器具与操作。这里通过图解认识这些形式，陈设中</text><text x="18" y="114" font-size="8" fill="#415c53">的炉具不作为观众自行点燃或加热的设施。</text></g></svg>