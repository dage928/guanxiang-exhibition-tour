<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">24  /  传香</text><text x="17" y="48" font-size="11" fill="#1e4744">带走莞香知识</text><text x="18" y="67" font-size="7" fill="#1e4744">用四个关联带走展览的主线。</text><text x="18" y="86" font-size="8" fill="#415c53">树与香材并不相同；地方生产与香市相互联系；气味体验来自具体样本；</text><text x="18" y="100" font-size="8" fill="#415c53">手艺由人与材料的相处延续。想继续了解，可从植物机构与国家级非遗</text><text x="18" y="114" font-size="8" fill="#415c53">项目档案开始。</text></g></svg>