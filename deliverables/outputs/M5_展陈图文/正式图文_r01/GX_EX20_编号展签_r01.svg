<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">20  /  传香</text><text x="17" y="48" font-size="11" fill="#1e4744">理香前后</text><text x="18" y="67" font-size="7" fill="#1e4744">在旁侧比较材料变化，补充站立观看。</text><text x="18" y="86" font-size="8" fill="#415c53">看过示范，再把处理前后的材料并置观察：哪些木质被移除，哪些部分</text><text x="18" y="100" font-size="8" fill="#415c53">留下？这处辅助台承接示范中的问题，供观众近看样件与工具说明。</text></g></svg>