<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">11  /  识香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香制作技艺</text><text x="18" y="67" font-size="7" fill="#1e4744">不同工艺解决不同材料问题。</text><text x="18" y="86" font-size="8" fill="#415c53">理香处理木质与香材的取舍；拣香依据材料特点分拣；窨香涉及存放与</text><text x="18" y="100" font-size="8" fill="#415c53">气味变化；合香着重香材的调配。这些名称帮助认识手艺内容，不能套</text><text x="18" y="114" font-size="8" fill="#415c53">成所有产品都必须依次经过的一条流水线。</text></g></svg>