<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200"><rect width="300" height="200" fill="#f4f0e5"/><g font-family="Microsoft YaHei, sans-serif" fill="#1e4744"><rect x="17" y="15" width="266" height="1" fill="#b59966"/><text x="18" y="29" font-size="4.5" fill="#967246">21  /  传香</text><text x="17" y="48" font-size="11" fill="#1e4744">莞香传承人</text><text x="18" y="67" font-size="7" fill="#1e4744">通过有档案的姓名和事件认识传承。</text><text x="18" y="86" font-size="8" fill="#415c53">黄欧是莞香制作技艺的国家级非遗代表性传承人。技艺也通过交流进入</text><text x="18" y="100" font-size="8" fill="#415c53">新的学习场景：2024年4月，东莞职业技术学院师生到莞香非遗文</text><text x="18" y="114" font-size="8" fill="#415c53">化园参访，听汤锦华介绍莞香。</text></g></svg>